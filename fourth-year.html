    ['f-name', 'f-phone', 'f-alt', 'f-city', 'f-addr', 'f-land', 'f-notes'].forEach(id => { const el = document.getElementById(id); if (el) f[id] = el.value; });
    const gv = document.getElementById('f-gov'); if (gv) f['f-gov'] = gv.value;
    const gn = document.querySelector('input[name="gender"]:checked'); if (gn) f.gender = gn.value;
    return f;
}
function setForm(f) { if (!f) return; Object.keys(f).forEach(k => { if (k === 'gender') { const r = document.querySelector(`input[name="gender"][value="${f[k]}"]`); if (r) r.checked = true; } else { const el = document.getElementById(k); if (el) el.value = f[k]; } }); }
function restoreState() { const raw = localStorage.getItem(SK); if (!raw) return false; try { const s = JSON.parse(raw); state = { ...state, ...s }; ES.forEach(e => { if (state.ess[e.id] === undefined) state.ess[e.id] = e.qty; }); return true; } catch (e) { return false; } }

let _tt;
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 1800); }

function openDetail(item, type, sid) {
    const pn = document.getElementById('detPn'); const ov = document.getElementById('detOv');
    let h = `<div class="det-back" onclick="closeDetail()"><i class="fas fa-arrow-right"></i><span>Back</span></div>`;
    h += `<div class="det-img"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="det-img-fb" style="display:none"><i class="fas fa-image"></i><span>${item.name}</span></div></div>`;
    h += `<div class="det-info"><div class="det-id">${item.id}</div><div class="det-name">${item.name}</div>`;
    if (item.brand) h += `<div class="det-brand"><i class="fas fa-tag"></i> ${item.brand}</div>`;
    h += `<div class="det-desc">${item.desc || ''}</div>`;
    if (type === 'oos') {
        h += `<div class="det-oos-tag"><i class="fas fa-box-open"></i> Out of Stock</div>`;
        h += `<div class="det-price-row"><span class="det-price" style="text-decoration:line-through;color:var(--text-s)">${item.price.toLocaleString()}</span><span class="det-price-cur">EGP</span></div></div>`;
        h += `<div class="det-acts"><div class="det-oos-box"><span class="det-oos-icon"><i class="fas fa-truck-ramp-box"></i></span><div class="det-oos-text">المنتج ده مش متوفر في السوق دلوقتي</div><div class="det-oos-sub"><strong>أول ما يتم توفيره هنعرفكم!</strong><br>هنتواصل معاك فور توفر المنتج.</div></div></div>`;
    } else {
        h += `<div class="det-price-row"><span class="det-price">${item.price.toLocaleString()}</span><span class="det-price-cur">EGP${item.note ? ' · ' + item.note : ''}</span></div></div>`;
        h += `<div class="det-acts">`;
        if (type === 'pd') {
            const isSel = state.sel[sid] && Array.isArray(state.sel[sid]) && state.sel[sid].some(s => s.id === item.id);
            const q = isSel ? state.sel[sid].find(s => s.id === item.id).qty || 1 : 1;
            if (isSel) {
                h += `<div class="det-qty-row"><span class="det-qty-label">Quantity</span><div class="pq pq-lg"><button onclick="detCqPd('${sid}','${item.id}',-1)">−</button><span id="detQ">${q}</span><button onclick="detCqPd('${sid}','${item.id}',1)">+</button></div></div>`;
                h += `<button class="det-btn remove" onclick="toggleSel('${sid}','${item.id}');closeDetail()"><i class="fas fa-trash"></i> Remove from Package</button>`;
            } else {
                h += `<button class="det-btn add" onclick="toggleSel('${sid}','${item.id}');closeDetail()"><i class="fas fa-plus"></i> Add to Package</button>`;
            }
        } else if (type === 'ess') {
            const q = state.ess[item.id] || 0; const isRm = q === 0;
            if (isRm) {
                h += `<button class="det-btn restore" onclick="state.ess['${item.id}']=ES.find(e=>e.id==='${item.id}')?.qty||1;renderEss();autoSave();closeDetail()"><i class="fas fa-plus"></i> Restore Item</button>`;
            } else {
                h += `<div class="det-qty-row"><span class="det-qty-label">Quantity</span><div class="pq pq-lg"><button onclick="detEssCh('${item.id}',-1)">−</button><span id="detQ">${q}</span><button onclick="detEssCh('${item.id}',1)">+</button></div></div>`;
                h += `<button class="det-btn remove" onclick="state.ess['${item.id}']=0;renderEss();autoSave();closeDetail()"><i class="fas fa-trash"></i> Remove from Essentials</button>`;
            }
        }
        h += `</div>`;
    }
    pn.innerHTML = h; ov.classList.add('open');
}
function detCqPd(sid, id, d) { if (!state.sel[sid] || !Array.isArray(state.sel[sid])) return; const it = state.sel[sid].find(x => x.id === id); if (!it) return; it.qty = Math.max(1, it.qty + d); const qEl = document.getElementById('detQ'); if (qEl) qEl.textContent = it.qty; renderGrid(sid); autoSave(); }
function detEssCh(id, d) { if (!state.ess[id] || state.ess[id] <= 0) return; state.ess[id] = Math.max(1, state.ess[id] + d); const qEl = document.getElementById('detQ'); if (qEl) qEl.textContent = state.ess[id]; renderEss(); autoSave(); }
function closeDetail() { document.getElementById('detOv').classList.remove('open'); }

function renderGrid(sid) {
    const grid = document.getElementById(sid + 'G'); if (!grid) return; let h = '';
    PD[sid].items.forEach(item => {
        const isSel = state.sel[sid] && Array.isArray(state.sel[sid]) && state.sel[sid].some(s => s.id === item.id);
        const q = isSel ? state.sel[sid].find(s => s.id === item.id).qty || 1 : 0;
        if (sid === 'anesthesia' && item.available === false) {
            h += `<div class="pc oos-card"><div class="pc-top"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="pc-top-fb" style="display:none"><i class="fas fa-image"></i><span>${item.name}</span></div><span class="oos-badge">Out of Stock</span></div><div class="pc-body"><div class="pc-id">${item.id}</div><div class="pc-nm">${item.name}</div><div class="pc-ds">${item.desc || ''}</div><div class="pc-bot"><span class="pc-pr">${item.price.toLocaleString()} EGP</span></div></div></div>`;
        } else {
            h += `<div class="pc ${isSel ? 'sel' : ''}" onclick="openDetail({...item}, 'pd', '${sid}')"><div class="pc-top"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="pc-top-fb" style="display:none"><i class="fas fa-image"></i><span>${item.name}</span></div></div><div class="pc-chk"><i class="fas fa-check"></i></div><div class="pc-body"><div class="pc-id">${item.id}</div><div class="pc-nm">${item.name}</div><div class="pc-ds">${item.desc || ''}</div>${item.brand ? `<div class="pc-brand">${item.brand}</div>` : ''}<div class="pc-bot"><span class="pc-pr">${item.price.toLocaleString()} EGP</span>${isSel ? `<div class="pq"><button onclick="event.stopPropagation();cqPd('${sid}','${item.id}',-1)">−</button><span>${q}</span><button onclick="event.stopPropagation();cqPd('${sid}','${item.id}',1)">+</button></div>` : ''}</div></div><button class="pc-add" onclick="event.stopPropagation();toggleSel('${sid}','${item.id}')"><span class="pc-add-n"><i class="fas fa-plus"></i> Add</span><span class="pc-add-d"><i class="fas fa-check"></i> Added</span></button></div>`;
        }
    });
    grid.innerHTML = h;
}

function toggleSel(sid, id) {
    if (!state.sel[sid] || !Array.isArray(state.sel[sid])) state.sel[sid] = [];
    const idx = state.sel[sid].findIndex(s => s.id === id);
    if (idx > -1) { state.sel[sid].splice(idx, 1); } else {
        const item = PD[sid].items.find(i => i.id === id); const defQty = item.defQty || 1;
        state.sel[sid].push({ id: id, qty: defQty }); showToast(`✅ تمت إضافة: ${item.name}`);
    }
    renderGrid(sid); updateStepState(sid); autoSave();
}
function cqPd(sid, id, d) { if (!state.sel[sid] || !Array.isArray(state.sel[sid])) return; const it = state.sel[sid].find(x => x.id === id); if (!it) return; it.qty = Math.max(1, it.qty + d); const item = PD[sid].items.find(i => i.id === id); if (d > 0) showToast(`➕ تم زيادة كمية: ${item.name} (${it.qty})`); renderGrid(sid); autoSave(); }

function renderEss() {
    const grid = document.getElementById('essG'); if (!grid) return; let h = '';
    const search = (document.getElementById('essSearch')?.value || '').toLowerCase();
    ES.forEach(item => {
        if (search && !item.name.toLowerCase().includes(search)) return;
        const q = state.ess[item.id] || 0; const isRm = q === 0;
        h += `<div class="ei ${isRm ? 'rm' : ''}" onclick="openDetail({...item,qty:state.ess['${item.id}']||0}, 'ess', '${item.id}')"><div class="ei-im"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none'"/></div><div class="ei-if"><div class="ei-id">${item.id}</div><div class="ei-nm">${item.name}</div><div class="ei-pr">${item.price.toLocaleString()} EGP</div></div><div class="ei-ac" onclick="event.stopPropagation()">${isRm ? `<button class="ei-rm" onclick="state.ess['${item.id}']=ES.find(e=>e.id==='${item.id}')?.qty||1;renderEss();autoSave()"><i class="fas fa-rotate-left"></i></button>` : `<button onclick="essCh('${item.id}',-1)">−</button><span class="ei-qt">${q}</span><button onclick="essCh('${item.id}',1)">+</button><button class="ei-rm" onclick="state.ess['${item.id}']=0;renderEss();autoSave()"><i class="fas fa-xmark"></i></button>`}</div></div>`;
    });
    grid.innerHTML = h;
}
function essCh(id, d) { if (!state.ess[id] || state.ess[id] <= 0) return; state.ess[id] = Math.max(1, state.ess[id] + d); const item = ES.find(e => e.id === id); if (d > 0) showToast(`✅ تمت إضافة: ${item.name} (${state.ess[id]} قطعة)`); renderEss(); autoSave(); }

function setGS(sz) { state.gSz = sz; state.gSk = false; document.querySelectorAll('.gl-ch').forEach(c => c.classList.toggle('on', c.dataset.sz === sz)); document.getElementById('gSkB').classList.remove('on'); updateStepState('gloves'); autoSave(); }
function skipG() { state.gSk = true; state.gSz = ''; document.querySelectorAll('.gl-ch').forEach(c => c.classList.remove('on')); document.getElementById('gSkB').classList.add('on'); showToast(SKIP_MSG.gloves); goNext('gloves'); }
function skipSec(sid) { state.sel[sid] = 'skip'; showToast(SKIP_MSG[sid] || 'تم تخطي الخطوة'); goNext(sid); }

function updateStepState(sid) {
    if (sid === 'intro' || sid === 'review') return; // intro and review buttons are always active
    const bc = document.getElementById('bc-' + sid); if (!bc) return; let ok = false;
    if (sid === 'info') { const v = e => e && e.trim(); ok = v(document.getElementById('f-name')?.value) && v(document.getElementById('f-phone')?.value) && v(document.getElementById('f-gov')?.value) && v(document.getElementById('f-addr')?.value); } 
    else if (sid === 'gloves') { ok = state.gSk || state.gSz !== ''; } 
    else if (sid === 'essentials') { ok = true; } 
    else { ok = state.sel[sid] && Array.isArray(state.sel[sid]) && state.sel[sid].length > 0; }
    bc.classList.toggle('on', ok);
    const stEl = document.getElementById('st-' + sid); if (stEl) { stEl.textContent = ok ? '✅ تم الاختيار' : 'لم تقم بالاختيار بعد'; stEl.className = 'st ' + (ok ? 'ok' : ''); }
}

function showStep(index) {
    document.querySelectorAll('.sec').forEach(el => el.classList.remove('on'));
    const sid = SO[index]; if (sid) { const el = document.getElementById('s-' + sid); if (el) el.classList.add('on'); }
    window.scrollTo({ top: 0, behavior: 'smooth' }); if (sid === 'review') renderReview();
}

function goNext(sid) { const idx = SO.indexOf(sid); if (idx === -1 || idx === SO.length - 1) return; state.cur = idx + 1; autoSave(); showStep(state.cur); updateProgress(); }
function goBack() { if (state.cur === 0) return; state.cur--; autoSave(); showStep(state.cur); updateProgress(); }
function updateProgress() { const pF = document.getElementById('pF'); const pL = document.getElementById('pL'); const p = ((state.cur + 1) / SO.length) * 100; pF.style.width = p + '%'; pL.textContent = `Step ${state.cur + 1} / ${SO.length}`; }

function renderReview() {
    const rvInfo = document.getElementById('rvInfo'); rvInfo.innerHTML = '';
    const f = getForm();
    rvInfo.innerHTML = `<div class="rr"><span class="rl">الاسم</span><span>${f['f-name'] || '-'}</span></div><div class="rr"><span class="rl">الموبايل</span><span>${f['f-phone'] || '-'}</span></div><div class="rr"><span class="rl">المحافظة</span><span>${f['f-gov'] || '-'}</span></div><div class="rr"><span class="rl">العنوان</span><span>${f['f-addr'] || '-'}</span></div>`;
    const rvItems = document.getElementById('rvItems'); let h = `<tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>`;
    let total = 0;
    SO.forEach(sid => {
        if (sid === 'gloves' && state.gSz) { h += `<tr><td>Gloves (${state.gSz})</td><td>1</td><td>${GLOVE_PRICE}</td><td>${GLOVE_PRICE}</td></tr>`; total += GLOVE_PRICE; } 
        else if (state.sel[sid] && Array.isArray(state.sel[sid])) { state.sel[sid].forEach(s => { let name = s.id, price = 0; if (PD[sid]) { const item = PD[sid].items.find(i => i.id === s.id); if (item) { name = item.name; price = item.price; } } h += `<tr><td>${name}</td><td>${s.qty}</td><td>${price}</td><td>${price * s.qty}</td></tr>`; total += price * s.qty; }); }
    });
    ES.forEach(e => { if (state.ess[e.id] > 0) { h += `<tr><td>${e.name}</td><td>${state.ess[e.id]}</td><td>${e.price}</td><td>${e.price * state.ess[e.id]}</td></tr>`; total += e.price * state.ess[e.id]; } });
    h += `<tr class="gr"><td colspan="3">الإجمالي</td><td>${total.toLocaleString()} EGP</td></tr>`;
    rvItems.innerHTML = h;
}

function initiateCheckout() {
    document.getElementById('chkOv').classList.add('open');
    document.getElementById('chkBox').innerHTML = `
        <div class="chk-icon"><i class="fas fa-file-pdf"></i></div>
        <div class="chk-title">طباعة الفاتورة</div>
        <div class="chk-desc">أنت دلوقتي هتطبع الفاتورة وتعمل لها تنزيل كـ PDF. دوس على الزرار ده علشان تفتح الفاتورة وتطبعتها.</div>
        <button class="chk-btn chk-btn-print" onclick="printInvoice()"><i class="fas fa-print"></i> طباعة وتنزيل الفاتورة</button>
        <button class="chk-btn chk-btn-skip" onclick="closeCheckout()">رجوع</button>
    `;
}

function printInvoice() {
    const f = getForm(); 
    let total = 0; 
    const items = [];
    
    // 🔥 توليد رقم الفاتورة والتاريخ
    const invoiceCounter = (parseInt(localStorage.getItem('curaInvoiceCounter') || '0') + 1);
    localStorage.setItem('curaInvoiceCounter', invoiceCounter.toString());
    const invoiceNumber = 'CURA-' + invoiceCounter.toString().padStart(5, '0');
    const invoiceDate = new Date().toLocaleString('ar-EG', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
    const isoDate = new Date().toISOString();

    // 🔥 جمع كل المنتجات المختارة
    SO.forEach(sid => {
        if (sid === 'gloves' && state.gSz) { 
            items.push({ 
                category: 'Gloves',
                name: `Gloves (Size: ${state.gSz})`, 
                qty: 1, 
                price: GLOVE_PRICE, 
                total: GLOVE_PRICE 
            }); 
            total += GLOVE_PRICE; 
        } 
        else if (state.sel[sid] && Array.isArray(state.sel[sid])) { 
            state.sel[sid].forEach(s => { 
                let name = s.id, price = 0, brand = ''; 
                if (PD[sid]) { 
                    const item = PD[sid].items.find(i => i.id === s.id); 
                    if (item) { 
                        name = item.name; 
                        price = item.price;
                        brand = item.brand || '';
                    } 
                } 
                items.push({ 
                    category: PD[sid]?.title || sid,
                    name, 
                    qty: s.qty, 
                    price, 
                    total: price * s.qty,
                    brand
                }); 
                total += price * s.qty; 
            }); 
        }
    });

    // 🔥 جمع الأدوات الأساسية
    ES.forEach(e => { 
        if (state.ess[e.id] > 0) { 
            items.push({ 
                category: 'الأدوات الأساسية',
                name: e.name, 
                qty: state.ess[e.id], 
                price: e.price, 
                total: e.price * state.ess[e.id],
                brand: ''
            }); 
            total += e.price * state.ess[e.id]; 
        } 
    });

    // 🔥 حفظ كل البيانات في localStorage بشكل كامل
    const invoiceData = { 
        invoiceNumber: invoiceNumber,
        invoiceDate: invoiceDate,
        isoDate: isoDate,
        customer: {
            name: f['f-name'] || '',
            phone: f['f-phone'] || '',
            altPhone: f['f-alt'] || '',
            gender: f.gender || '',
            gov: f['f-gov'] || '',
            city: f['f-city'] || '',
            address: f['f-addr'] || '',
            landmark: f['f-land'] || '',
            notes: f['f-notes'] || ''
        },
        items: items,
        itemsCount: items.length,
        subtotal: total,
        total: total,
        currency: 'EGP',
        generatedAt: new Date().toISOString()
    };
    
    localStorage.setItem('curaInvoice', JSON.stringify(invoiceData));
    window.open('invoice.html', '_blank'); 

    document.getElementById('chkBox').innerHTML = `
        <div class="chk-icon wa"><i class="fab fa-whatsapp"></i></div>
        <div class="chk-title">تأكيد الطلب</div>
        <div class="chk-desc">دلوقتي باقي بس تتأكد من الأوردر وتتواصل مع مسؤول التأكيد. دوس على الزرار ده علشان نبعتلك كل التفاصيل على واتساب.</div>
        <button class="chk-btn chk-btn-wa" onclick="goToWhatsApp()"><i class="fab fa-whatsapp"></i> تواصل عبر واتساب للتأكيد</button>
        <button class="chk-btn chk-btn-skip" onclick="closeCheckout()">تم بنجاح</button>
    `;
}

function goToWhatsApp() {
    let msg = '🌟 *طلب جديد من Cura Store* 🌟\n\n';
    
    const invoiceCounter = parseInt(localStorage.getItem('curaInvoiceCounter') || '0');
    const invoiceNumber = 'CURA-' + invoiceCounter.toString().padStart(5, '0');
    msg += `🧾 *رقم الفاتورة:* ${invoiceNumber}\n\n`;
    
    SO.forEach(sid => {
        if (sid === 'gloves' && state.gSz) { msg += `🧤 Gloves (${state.gSz}) - 1 قطعة - ${GLOVE_PRICE} EGP\n`; } 
        else if (state.sel[sid] && Array.isArray(state.sel[sid])) {
            msg += `\n*${PD[sid]?.title || ''}:*\n`;
            state.sel[sid].forEach(s => { let name = s.id, price = 0; if (PD[sid]) { const item = PD[sid].items.find(i => i.id === s.id); if (item) { name = item.name; price = item.price; } } msg += `▪️ ${name} (${s.qty}x) - ${price * s.qty} EGP\n`; });
        }
    });
    let essAdded = false; ES.forEach(e => { if (state.ess[e.id] > 0) { if (!essAdded) { msg += '\n*الأدوات الأساسية:*\n'; essAdded = true; } msg += `▪️ ${e.name} (${state.ess[e.id]}x) - ${e.price * state.ess[e.id]} EGP\n`; } });
    const f = getForm();
    msg += `\n*بيانات التوصيل:*\n👤 الاسم: ${f['f-name'] || '-'}\n📱 الموبايل: ${f['f-phone'] || '-'}\n📍 المحافظة: ${f['f-gov'] || '-'}\n🏠 العنوان: ${f['f-addr'] || '-'}\n`;
    window.open(`https://wa.me/201000000000?text=${encodeURIComponent(msg)}`, '_blank');
    closeCheckout();
}

function closeCheckout() { document.getElementById('chkOv').classList.remove('open'); }

function toggleTheme() { const c = document.documentElement.getAttribute('data-theme'); if (c === 'dark') { document.documentElement.removeAttribute('data-theme'); document.getElementById('thIco').className = 'fas fa-moon'; } else { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('thIco').className = 'fas fa-sun'; } localStorage.setItem('curaTheme', document.documentElement.getAttribute('data-theme') || 'light'); }
function initTheme() { const t = localStorage.getItem('curaTheme'); if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('thIco').className = 'fas fa-sun'; } }
function newOrder() { if (confirm('هل أنت متأكد من بدء طلب جديد؟ سيتم مسح كل البيانات الحالية.')) { localStorage.removeItem(SK); location.reload(); } }

initTheme();
const restored = restoreState();
buildApp();

if (restored && state.cur > 0) {
    setForm(state.form);
    if (state.sq && document.getElementById('essSearch')) document.getElementById('essSearch').value = state.sq;
    SO.forEach(sid => updateStepState(sid));
    showStep(state.cur);
} else {
    state.cur = 0;
    showStep(0);
}
updateProgress();
</script>
</body>
</html>
