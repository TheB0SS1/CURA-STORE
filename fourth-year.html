<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🦷 Cura Store · قريباً</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f6ff;
            color: #0b1a2e;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ===== الخلفية المتحركة ===== */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-canvas .tooth {
            position: absolute;
            font-size: 3.5rem;
            opacity: 0.08;
            color: #0d9488;
            animation: floatTooth 28s infinite alternate ease-in-out;
            user-select: none;
            filter: drop-shadow(0 8px 20px rgba(13, 148, 136, 0.05));
        }

        .bg-canvas .tooth:nth-child(1) {
            top: 4%;
            left: 2%;
            font-size: 7rem;
            animation-duration: 32s;
        }
        .bg-canvas .tooth:nth-child(2) {
            top: 12%;
            right: 6%;
            font-size: 5rem;
            animation-duration: 26s;
            animation-delay: -4s;
        }
        .bg-canvas .tooth:nth-child(3) {
            bottom: 18%;
            left: 8%;
            font-size: 8rem;
            animation-duration: 36s;
            animation-delay: -8s;
        }
        .bg-canvas .tooth:nth-child(4) {
            bottom: 25%;
            right: 4%;
            font-size: 5.5rem;
            animation-duration: 30s;
            animation-delay: -6s;
        }
        .bg-canvas .tooth:nth-child(5) {
            top: 40%;
            left: 1%;
            font-size: 4.5rem;
            animation-duration: 34s;
            animation-delay: -12s;
        }
        .bg-canvas .tooth:nth-child(6) {
            top: 55%;
            right: 1%;
            font-size: 6rem;
            animation-duration: 28s;
            animation-delay: -3s;
        }
        .bg-canvas .tooth:nth-child(7) {
            top: 28%;
            left: 22%;
            font-size: 4rem;
            animation-duration: 38s;
            animation-delay: -10s;
        }
        .bg-canvas .tooth:nth-child(8) {
            bottom: 8%;
            right: 16%;
            font-size: 5.2rem;
            animation-duration: 31s;
            animation-delay: -14s;
        }
        .bg-canvas .tooth:nth-child(9) {
            top: 72%;
            left: 28%;
            font-size: 3.8rem;
            animation-duration: 33s;
            animation-delay: -5s;
        }
        .bg-canvas .tooth:nth-child(10) {
            top: 8%;
            left: 48%;
            font-size: 6.5rem;
            animation-duration: 37s;
            animation-delay: -9s;
        }

        @keyframes floatTooth {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(35px, -45px) rotate(14deg) scale(1.08);
            }
            50% {
                transform: translate(-25px, 35px) rotate(-10deg) scale(0.92);
            }
            75% {
                transform: translate(45px, 25px) rotate(8deg) scale(1.04);
            }
            100% {
                transform: translate(-35px, -25px) rotate(-12deg) scale(1);
            }
        }

        /* ===== جسيمات الأدوات ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.06;
            animation: particleDrift 22s infinite linear;
        }

        .particle:nth-child(1) {
            top: 8%;
            left: 4%;
            animation-duration: 24s;
            font-size: 2rem;
        }
        .particle:nth-child(2) {
            top: 22%;
            right: 12%;
            animation-duration: 18s;
            animation-delay: -5s;
            font-size: 1.6rem;
        }
        .particle:nth-child(3) {
            bottom: 12%;
            left: 18%;
            animation-duration: 26s;
            animation-delay: -9s;
            font-size: 2.2rem;
        }
        .particle:nth-child(4) {
            bottom: 35%;
            right: 8%;
            animation-duration: 21s;
            animation-delay: -4s;
            font-size: 1.8rem;
        }
        .particle:nth-child(5) {
            top: 48%;
            left: 6%;
            animation-duration: 28s;
            animation-delay: -13s;
            font-size: 1.5rem;
        }

        @keyframes particleDrift {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(60px, -40px) rotate(200deg);
            }
            100% {
                transform: translate(-40px, 50px) rotate(400deg);
            }
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 760px;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 80px rgba(0, 20, 40, 0.08), 0 8px 32px rgba(0, 0, 0, 0.02);
            animation: fadeUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #0d9488;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 8px 30px rgba(13, 148, 136, 0.2);
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #0b1a2e;
        }

        .logo-text span {
            color: #0d9488;
            font-weight: 300;
        }

        .badge {
            display: inline-block;
            background: rgba(13, 148, 136, 0.08);
            border: 1px solid rgba(13, 148, 136, 0.15);
            border-radius: 100px;
            padding: 4px 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #0d9488;
            letter-spacing: 0.5px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.15;
            margin: 18px 0 12px;
            background: linear-gradient(135deg, #0b1a2e 0%, #0d9488 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            font-size: 1.05rem;
            color: #4a5a7a;
            max-width: 480px;
            margin: 0 auto 28px;
            line-height: 1.7;
        }

        .sub i {
            color: #0d9488;
            margin: 0 4px;
        }

        /* ===== لعبة الأسنان التفاعلية ===== */
        .click-game {
            margin: 14px auto 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .game-tooth {
            font-size: 3.2rem;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0.5;
            filter: grayscale(0.3);
            user-select: none;
            display: inline-block;
        }

        .game-tooth:hover {
            transform: scale(1.25) rotate(-10deg);
            opacity: 1;
            filter: grayscale(0);
        }

        .game-tooth:active {
            transform: scale(0.7) rotate(15deg);
        }

        .game-score {
            font-size: 0.85rem;
            color: #4a5a7a;
            margin-top: 4px;
            font-weight: 600;
        }

        .game-score span {
            color: #0d9488;
            font-weight: 800;
            font-size: 1.1rem;
        }

        /* ===== شريط التقدم ===== */
        .progress-wrap {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 24px;
            background: rgba(13, 148, 136, 0.06);
            border-radius: 100px;
            height: 6px;
            overflow: hidden;
            border: 1px solid rgba(13, 148, 136, 0.06);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0d9488, #14b8a6);
            border-radius: 100px;
            animation: fillProgress 5s ease-in-out infinite alternate;
        }

        @keyframes fillProgress {
            0% {
                width: 8%;
            }
            100% {
                width: 92%;
            }
        }

        .progress-label {
            font-size: 0.65rem;
            color: #6a7a9a;
            letter-spacing: 0.3px;
        }

        .progress-label i {
            color: #0d9488;
            margin: 0 4px;
        }

        /* ===== زر الإشعار ===== */
        .notify-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #0d9488;
            border: none;
            padding: 14px 40px;
            border-radius: 100px;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(13, 148, 136, 0.2);
            font-family: inherit;
            margin-top: 4px;
        }

        .notify-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(13, 148, 136, 0.3);
            background: #0b7d72;
        }

        .notify-btn:active {
            transform: scale(0.97);
        }

        .notify-btn i {
            font-size: 1.1rem;
        }

        /* ===== تذييل ===== */
        .footer-note {
            margin-top: 28px;
            font-size: 0.7rem;
            color: #6a7a9a;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 20px;
        }

        .footer-note a {
            color: #0d9488;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        /* ===== Toast ===== */
        .custom-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #ffffff;
            color: #0b1a2e;
            padding: 12px 28px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(13, 148, 136, 0.1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
            z-index: 9999;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .custom-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== متجاوب ===== */
        @media (max-width: 600px) {
            .main-content {
                padding: 1.5rem 1rem;
                margin: 0 12px;
                border-radius: 28px;
            }

            h1 {
                font-size: 2rem;
            }

            .logo-text {
                font-size: 1.6rem;
            }

            .notify-btn {
                padding: 12px 28px;
                font-size: 0.85rem;
            }

            .bg-canvas .tooth {
                font-size: 2.5rem !important;
            }
            .particle {
                font-size: 1rem !important;
            }

            .game-tooth {
                font-size: 2.6rem;
            }
        }

        @media (max-width: 420px) {
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== خلفية الأسنان ===== -->
    <div class="bg-canvas">
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
        <div class="tooth"><i class="fas fa-tooth"></i></div>
    </div>

    <!-- ===== جسيمات الأدوات ===== -->
    <div class="particles">
        <div class="particle"><i class="fas fa-syringe"></i></div>
        <div class="particle"><i class="fas fa-microscope"></i></div>
        <div class="particle"><i class="fas fa-stethoscope"></i></div>
        <div class="particle"><i class="fas fa-flask"></i></div>
        <div class="particle"><i class="fas fa-bolt"></i></div>
    </div>

    <!-- ===== المحتوى الرئيسي ===== -->
    <div class="main-content">

        <div class="logo">
            <div class="logo-mark">C</div>
            <div class="logo-text">CURA <span>STORE</span></div>
        </div>

        <div class="badge">
            <i class="fas fa-code-branch"></i> قيد التطوير
        </div>

        <h1>🔧 تحديثات جديدة قريباً</h1>

        <p class="sub">
            <i class="fas fa-cogs"></i> نعمل على إضافة أدوات جديدة وتحديثات متطورة
            <br /> ستكون تجربة التسوق أفضل وأسرع
        </p>

        <!-- ===== شريط التقدم ===== -->
        <div class="progress-wrap">
            <div class="progress-fill"></div>
        </div>
        <div class="progress-label">
            <i class="fas fa-spinner fa-pulse"></i> جاري التحضير ...
        </div>

        <!-- ===== لعبة الأسنان التفاعلية ===== -->
        <div class="click-game">
            <span class="game-tooth" onclick="clickTooth(this)"><i class="fas fa-tooth"></i></span>
            <span class="game-tooth" onclick="clickTooth(this)"><i class="fas fa-tooth"></i></span>
            <span class="game-tooth" onclick="clickTooth(this)"><i class="fas fa-tooth"></i></span>
            <span class="game-tooth" onclick="clickTooth(this)"><i class="fas fa-tooth"></i></span>
        </div>
        <div class="game-score">
            🦷 عدد الأسنان المضغوطة: <span id="toothCount">0</span>
        </div>

        <!-- ===== زر الإشعار ===== -->
        <button class="notify-btn" onclick="notifyMe()">
            <i class="fas fa-bell"></i> أخبرني عند التحديث
        </button>

        <!-- ===== تذييل ===== -->
        <div class="footer-note">
            CURA STORE · مستلزمات طب الأسنان المتميزة
            <br />
            تصميم <a href="https://zead1254.github.io/Dr_zead/" target="_blank">The Boss</a>
            &nbsp;·&nbsp; <i class="fas fa-code"></i> سيتم التحديث قريباً
        </div>
    </div>

    <script>
        // ============================================================
        //  لعبة الأسنان
        // ============================================================
        let toothClicks = 0;

        function clickTooth(el) {
            toothClicks++;
            document.getElementById('toothCount').textContent = toothClicks;

            // تأثير بصري
            el.style.transition = '0.12s cubic-bezier(0.34, 1.56, 0.64, 1)';
            el.style.transform = 'scale(0.5) rotate(25deg)';
            el.style.opacity = '0.8';
            setTimeout(() => {
                el.style.transform = 'scale(1) rotate(0deg)';
                el.style.opacity = '0.5';
            }, 150);

            // رسائل تشجيعية
            if (toothClicks === 10) showToast('🦷 10! أسنانك قوية 💪');
            else if (toothClicks === 25) showToast('🦷🦷 25! أنت طبيب أسنان محترف 😄');
            else if (toothClicks === 50) showToast('🦷✨ 50! عيادتك جاهزة للافتتاح 🎉');
            else if (toothClicks === 100) showToast('🏆 100! أسطورة طب الأسنان! 👑');
        }

        // ============================================================
        //  Toast
        // ============================================================
        function showToast(msg) {
            const old = document.querySelector('.custom-toast');
            if (old) old.remove();

            const t = document.createElement('div');
            t.className = 'custom-toast';
            t.textContent = msg;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));

            setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => t.remove(), 400);
            }, 2200);
        }

        // ============================================================
        //  زر الإشعار
        // ============================================================
        function notifyMe() {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('🔔 Cura Store', {
                    body: 'سنخبرك فور إطلاق التحديثات الجديدة!',
                    icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230d9488"%3E%3Cpath d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/%3E%3C/svg%3E'
                });
                showToast('✅ تم التسجيل! سنخبرك عند التحديث.');
            } else if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') notifyMe();
                    else showToast('📩 وافق على الإشعارات ليصلك التحديث.');
                });
            } else {
                showToast('📩 تابعنا على وسائل التواصل لمعرفة التحديثات.');
            }
        }

        // ============================================================
        //  بدء التشغيل
        // ============================================================
        // طلب إذن الإشعارات
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // شريط التقدم العشوائي
        const fill = document.querySelector('.progress-fill');
        if (fill) {
            setInterval(() => {
                fill.style.width = (25 + Math.random() * 60) + '%';
            }, 4500);
        }

        console.log('🦷 Cura Store — قريباً');
    </script>

</body>
</html>
