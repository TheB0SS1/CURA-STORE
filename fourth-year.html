<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes,viewport-fit=cover"/>
<title>Cura Store · Premium Dental Supplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f3f4f6;--surface:#ffffff;--text:#0f172a;--text-s:#64748b;
--border:#e2e8f0;--primary:#0f172a;--accent:#0d9488;
--accent-l:rgba(13,148,136,.05);--accent-m:rgba(13,148,136,.12);
--gold:#b45309;--gold-l:rgba(180,83,9,.06);
--danger:#dc2626;--danger-l:rgba(220,38,38,.05);
--sh-s:0 1px 3px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.02);
--sh-m:0 4px 16px rgba(15,23,42,.06),0 1px 4px rgba(15,23,42,.03);
--sh-lg:0 12px 40px rgba(15,23,42,.08);
--r:16px;--rs:12px;--pill:100px;
--tr:.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
--bg:#0b1120;--surface:#131c2e;--text:#e2e8f0;--text-s:#64748b;
--border:#1e293b;--primary:#e2e8f0;--accent:#14b8a6;
--accent-l:rgba(20,184,166,.06);--accent-m:rgba(20,184,166,.15);
--gold:#f59e0b;--gold-l:rgba(245,158,11,.06);
--danger:#f87171;--danger-l:rgba(248,113,113,.06);
--sh-s:0 1px 3px rgba(0,0,0,.2);--sh-m:0 4px 16px rgba(0,0,0,.25);--sh-lg:0 12px 40px rgba(0,0,0,.35);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;
background-image:radial-gradient(circle at 15% 50%,rgba(13,148,136,.03) 0%,transparent 50%),radial-gradient(circle at 85% 20%,rgba(245,158,11,.025) 0%,transparent 50%)}
.ctn{max-width:980px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
a{text-decoration:none;color:inherit}button{font-family:inherit}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);border-bottom:1px solid var(--border);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);transition:background .3s,border .3s}
[data-theme="dark"] .nav{background:rgba(11,17,32,.9)}
.nav .ctn{display:flex;justify-content:space-between;align-items:center;height:56px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.85rem}
.logo-t{font-size:1.2rem;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.logo-t span{font-weight:300;color:var(--accent)}
.nav-a{display:flex;align-items:center;gap:8px}
.nb{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--pill);font-size:.7rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:var(--tr);height:34px}
.nb:hover{border-color:var(--accent);background:var(--accent-l)}
.nb.wa{background:#25D366;color:#fff;border-color:#25D366}.nb.wa:hover{background:#1da851}
.nb.no{color:var(--text-s);border-color:transparent;font-size:.65rem;padding:6px 10px}.nb.no:hover{color:var(--danger);background:var(--danger-l);border-color:transparent}

/* PROGRESS */
.prog{position:sticky;top:56px;z-index:99;background:var(--surface);border-bottom:1px solid var(--border);transition:background .3s,border .3s}
.prog .ctn{height:36px;display:flex;align-items:center;gap:14px}
.prog-t{flex:1;height:3px;background:var(--border);border-radius:10px;overflow:hidden}
.prog-f{height:100%;background:linear-gradient(90deg,var(--accent),#f59e0b);border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0}
.prog-l{font-size:.62rem;font-weight:600;color:var(--text-s);white-space:nowrap;letter-spacing:.2px}

/* HERO */
.hero{padding:28px 0 10px;text-align:center}
.hero h2{font-size:1.5rem;font-weight:700;letter-spacing:-.3px;color:var(--text)}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{font-size:.82rem;color:var(--text-s);max-width:420px;margin:4px auto 0}

/* SECTIONS */
.sec{display:none;background:var(--surface);border-radius:var(--r);padding:28px 24px;border:1px solid var(--border);box-shadow:var(--sh-m);margin-bottom:16px;transition:background .3s,border .3s,box-shadow .3s}
.sec.on{display:block;animation:si .35s cubic-bezier(.4,0,.2,1) both}
@keyframes si{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.s-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.s-b{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;flex-shrink:0;background:var(--accent-l);color:var(--accent);font-size:.68rem;font-weight:800}
.s-t{font-size:1rem;font-weight:700;color:var(--text);line-height:1.2}
.s-d{font-size:.72rem;color:var(--text-s);margin-top:1px}

/* PRODUCT CARDS — Multi-select */
.pr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.pc{background:var(--surface);border-radius:var(--rs);border:1.5px solid var(--border);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;position:relative;overflow:hidden}
.pc:hover{border-color:var(--accent);box-shadow:var(--sh-m);transform:translateY(-2px)}
.pc:active{transform:translateY(0);box-shadow:var(--sh-s)}
.pc.sel{border-color:var(--accent);background:var(--accent-l);box-shadow:0 0 0 3px var(--accent-m)}
.pc-img{height:140px;overflow:hidden;background:var(--bg);position:relative;display:flex;align-items:center;justify-content:center}
.pc-img img{width:100%;height:100%;object-fit:contain;padding:10px;transition:transform .4s cubic-bezier(.4,0,.2,1);display:block}
.pc:hover .pc-img img{transform:scale(1.05)}
.pc-fb{display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#c0c8d4;padding:8px;text-align:center;width:100%;height:100%;position:absolute;inset:0}
.pc-fb i{font-size:1.5rem;opacity:.3}.pc-fb span{font-size:.5rem;font-weight:600;opacity:.4;max-width:85%}
.pc-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}
.pc-id{font-size:.52rem;font-weight:700;color:var(--accent);letter-spacing:.4px;text-transform:uppercase}
.pc-nm{font-weight:700;font-size:.78rem;color:var(--text);line-height:1.3;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-ds{font-size:.65rem;color:var(--text-s);flex:1;margin-top:1px}
.pc-bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.pc-pr{font-weight:800;font-size:.88rem;color:var(--gold);white-space:nowrap}
.pq{display:inline-flex;align-items:center;gap:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--pill);padding:1px 3px}
.pq button{background:none;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.pq button:hover{background:var(--accent-l);color:var(--accent)}
.pq span{min-width:16px;text-align:center;font-weight:700;font-size:.72rem}
.pq-lg button{width:36px;height:36px;font-size:1rem}.pq-lg span{min-width:28px;font-size:.9rem}
.pc-chk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.55rem;color:transparent;transition:var(--tr);background:var(--surface);z-index:4;cursor:pointer}
.pc-chk:hover{border-color:var(--accent);background:var(--accent-l);color:var(--accent)}
.pc.sel .pc-chk{background:var(--accent);border-color:var(--accent);color:#fff}
.pc-brand{font-size:.55rem;color:var(--text-s);font-weight:500;margin-top:2px;opacity:.7}

/* SECTION NAV */
.sn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.b-bk{padding:8px 16px;border-radius:var(--pill);border:1px solid var(--border);background:var(--surface);color:var(--text-s);font-weight:600;font-size:.75rem;cursor:pointer;transition:var(--tr);height:36px;display:inline-flex;align-items:center;gap:5px}
.b-bk:hover{border-color:var(--text-s);color:var(--text)}
.b-sk{background:none;border:none;color:var(--text-s);font-size:.72rem;font-weight:500;cursor:pointer;padding:8px 12px;border-radius:var(--pill);transition:var(--tr);text-decoration:underline;text-underline-offset:2px;height:36px;display:inline-flex;align-items:center}
.b-sk:hover{color:var(--accent);background:var(--accent-l);text-decoration:none}
.b-co{padding:8px 24px;border-radius:var(--pill);border:none;background:var(--primary);color:var(--surface);font-weight:700;font-size:.78rem;cursor:pointer;transition:var(--tr);opacity:.3;pointer-events:none;margin-left:auto;height:36px;display:inline-flex;align-items:center;gap:5px}
[data-theme="dark"] .b-co{background:var(--accent)}
.b-co.on{opacity:1;pointer-events:auto}
.b-co.on:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 12px rgba(13,148,136,.2)}
[data-theme="dark"] .b-co.on:hover{box-shadow:0 4px 12px rgba(20,184,166,.2)}
.b-co.on.pulse{animation:bp 2s ease infinite}
@keyframes bp{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,.25)}50%{box-shadow:0 0 0 6px rgba(13,148,136,0)}}

/* TOP CONTINUE for Essentials */
.top-co{display:flex;justify-content:flex-end;margin-bottom:14px}
.top-co .b-co{margin-left:0}

/* GLOVES */
.gl-w{max-width:300px;margin:0 auto}
.gl-img{height:150px;overflow:hidden;background:var(--bg);border-radius:var(--rs);margin-bottom:14px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.gl-img img{width:100%;height:100%;object-fit:contain;padding:12px}
.gl-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.gl-ch{padding:8px 22px;border-radius:var(--pill);border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:.82rem;cursor:pointer;transition:var(--tr);color:var(--text-s);min-width:48px;text-align:center}
.gl-ch:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.gl-ch.on{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(13,148,136,.2)}
.gl-sk{display:block;margin:0 auto 12px;background:none;border:none;color:var(--text-s);font-size:.75rem;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px;transition:var(--tr);font-family:inherit}
.gl-sk:hover{color:var(--accent)}.gl-sk.on{color:var(--accent);text-decoration:none}

/* STATUS */
.st{font-size:.68rem;font-weight:600;color:var(--text-s);margin-bottom:4px;min-height:15px}
.st.ok{color:var(--accent)}.st.sk{color:var(--text-s);font-style:italic}

/* ESSENTIALS — Arabic Banner */
.es-ban{background:var(--accent-l);border-radius:var(--rs);padding:18px 20px;margin-bottom:14px;border-left:3px solid var(--accent);direction:rtl;text-align:right}
.es-ban .es-title{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.es-ban .es-body{font-size:.76rem;color:var(--text-s);line-height:1.85}
.es-ban .es-body ul{list-style:none;padding:0;margin:6px 0 0}
.es-ban .es-body ul li{padding:2px 0;padding-right:16px;position:relative}
.es-ban .es-body ul li::before{content:"•";position:absolute;right:0;color:var(--accent);font-weight:700}
.es-ban .es-count{display:inline-block;margin-top:8px;font-size:.68rem;font-weight:600;color:var(--accent);background:var(--accent-m);padding:3px 12px;border-radius:var(--pill);direction:ltr;text-align:center}
.sb{width:100%;max-width:340px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--pill);background:var(--surface);color:var(--text);font-size:.78rem;font-family:inherit;transition:var(--tr);outline:none;margin-bottom:10px}
.sb:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.ei{background:var(--bg);border-radius:var(--rs);padding:6px 8px;border:1px solid var(--border);display:flex;align-items:center;gap:8px;transition:var(--tr);cursor:pointer}
.ei:hover{border-color:var(--accent)}
.ei.rm{opacity:.35}.ei.rm:hover{opacity:.6}
.ei-im{width:48px;height:48px;border-radius:8px;flex-shrink:0;overflow:hidden;background:var(--surface);position:relative;border:1px solid var(--border)}
.ei-im img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.ei-im .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#c0c8d4;font-size:.9rem}
.ei-if{flex:1;min-width:0}
.ei-id{font-size:.46rem;font-weight:700;color:var(--accent);letter-spacing:.3px;text-transform:uppercase}
.ei-nm{font-size:.68rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-pr{font-size:.6rem;font-weight:700;color:var(--gold)}
.ei-ac{display:flex;align-items:center;gap:1px;flex-shrink:0}
.ei-ac button{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;font-size:.65rem;color:var(--text);display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.ei-ac button:hover{border-color:var(--accent);background:var(--accent-l);color:var(--accent)}
.ei-qt{min-width:14px;text-align:center;font-weight:700;font-size:.65rem}
.ei-rm{color:var(--danger)!important;border-color:rgba(220,38,38,.15)!important;font-size:.45rem!important}
.ei-rm:hover{background:var(--danger-l)!important;border-color:var(--danger)!important}

/* FORM */
.ig{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ig .fl{grid-column:1/-1}
.ig label{display:block;font-weight:600;font-size:.68rem;color:var(--text-s);margin-bottom:3px}
.ig input,.ig select,.ig textarea{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:var(--pill);background:var(--surface);color:var(--text);font-family:inherit;font-size:.8rem;transition:var(--tr);outline:none}
.ig input:focus,.ig select:focus,.ig textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.ig textarea{border-radius:var(--rs);resize:vertical;min-height:48px}
.rg{display:flex;gap:18px;padding-top:3px}
.rg label{display:flex;align-items:center;gap:5px;font-weight:500;font-size:.8rem;color:var(--text);cursor:pointer}
.rg input[type="radio"]{accent-color:var(--accent);width:15px;height:15px}

/* REVIEW */
.rv-s{background:var(--bg);border-radius:var(--rs);padding:14px;border:1px solid var(--border);margin-bottom:12px}
.rv-s h4{font-size:.8rem;font-weight:700;margin-bottom:8px;color:var(--accent)}
.rv-c{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:.72rem}
.rv-c .rr{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed var(--border)}
.rv-c .rl{color:var(--text-s);font-weight:500}
.rv-t{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:12px}
.rv-t th{background:var(--primary);color:var(--surface);padding:7px 5px;text-align:center;font-weight:700;font-size:.65rem;letter-spacing:.2px}
[data-theme="dark"] .rv-t th{background:var(--accent);color:#fff}
.rv-t td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--border)}
.rv-t tr:hover td{background:var(--accent-l)}
.rv-t .gr td{font-weight:800;font-size:.9rem;background:var(--gold-l);border-top:2px solid var(--gold);color:var(--gold)}

footer{text-align:center;padding:16px 0;border-top:1px solid var(--border);margin-top:12px;font-size:.6rem;color:var(--text-s);letter-spacing:.3px}
footer a{color:var(--accent);font-weight:600}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--primary);color:var(--surface);padding:12px 28px;border-radius:var(--pill);font-size:.78rem;font-weight:600;z-index:9999;transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:520px;text-align:center;line-height:1.6;direction:rtl;white-space:normal;pointer-events:none}
[data-theme="dark"] .toast{background:var(--surface);color:var(--text)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ======= PRODUCT DETAIL OVERLAY ======= */
.det-ov{position:fixed;inset:0;z-index:200;display:flex;opacity:0;pointer-events:none;transition:opacity .3s ease}
.det-ov.open{opacity:1;pointer-events:auto}
.det-bd{position:absolute;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.det-pn{position:relative;width:100%;max-width:500px;margin-left:auto;background:var(--surface);overflow-y:auto;transform:translateX(100%);transition:transform .38s cubic-bezier(.32,.72,.24,1.02);display:flex;flex-direction:column;max-height:100vh}
.det-ov.open .det-pn{transform:translateX(0)}
.det-back{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);cursor:pointer;transition:var(--tr);flex-shrink:0}
.det-back:hover{background:var(--accent-l)}
.det-back i{font-size:.85rem;color:var(--accent)}
.det-back span{font-size:.82rem;font-weight:600;color:var(--text)}
.det-img{width:100%;height:320px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative}
.det-img img{max-width:100%;max-height:100%;object-fit:contain;padding:32px;transition:transform .3s}
.det-img-fb{display:none;flex-direction:column;align-items:center;gap:4px;color:#c0c8d4}
.det-img-fb i{font-size:2.5rem;opacity:.3}
.det-info{padding:22px 24px 0;flex:1}
.det-id{font-size:.6rem;font-weight:700;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.det-name{font-size:1.15rem;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:6px}
.det-brand{font-size:.75rem;color:var(--text-s);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.det-brand i{color:var(--accent);font-size:.65rem}
.det-desc{font-size:.82rem;color:var(--text-s);line-height:1.65;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.det-price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:20px}
.det-price{font-size:1.6rem;font-weight:900;color:var(--gold)}
.det-price-cur{font-size:.85rem;font-weight:600;color:var(--text-s)}
.det-acts{padding:0 24px 32px;flex-shrink:0}
.det-qty-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:12px 16px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--border)}
.det-qty-label{font-size:.78rem;font-weight:600;color:var(--text-s)}
.det-btn{width:100%;padding:14px;border-radius:var(--pill);border:none;font-weight:700;font-size:.88rem;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:8px}
.det-btn.add{background:var(--accent);color:#fff}
.det-btn.add:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 20px rgba(13,148,136,.25)}
.det-btn.remove{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)}
.det-btn.remove:hover{background:var(--danger-l)}

@media(max-width:700px){
.nav .ctn{height:50px}.logo-mark{width:28px;height:28px;font-size:.75rem}.logo-t{font-size:1.05rem}
.pr{grid-template-columns:1fr 1fr}.eg{grid-template-columns:1fr}
.ig{grid-template-columns:1fr}.rv-c{grid-template-columns:1fr}
.hero h2{font-size:1.3rem}.hero{padding:20px 0 8px}
.sec{padding:20px 16px}.sn{flex-wrap:wrap;gap:6px}
.b-co{margin-left:0;width:100%;justify-content:center}
.pc-img{height:115px}
.toast{max-width:90vw;font-size:.72rem;padding:10px 18px}
.det-pn{max-width:100%}.det-img{height:240px}.det-img img{padding:20px}

  /* Review section */
  n++;
  app.innerHTML+=`<div class="sec" id="s-review">
    <div class="s-hdr"><div class="s-b">${n}</div><div><div class="s-t">Order Review</div><div class="s-d">راجع الأوردر قبل ما تعمل الفاتورة.</div></div></div>
    <div id="revC"></div>
    <div class="sn" style="margin-top:12px"><button class="b-bk" onclick="goBack()"><i class="fas fa-arrow-left"></i></button><div></div><button class="b-co on pulse" onclick="genInvoice()" style="background:var(--accent)">Generate Invoice <i class="fas fa-file-invoice"></i></button></div>
  </div>`;

  /* Render product grids */
  Object.keys(PD).forEach(renderGrid);
  renderEss();
  updateProg();

  /* Restore saved state */
  const saved=restoreState();
  if(saved){
    setTimeout(()=>{
      if(saved.form)setForm(saved.form);
      if(saved.sq){const el=document.getElementById('essSearch');if(el){el.value=saved.sq;renderEss();}}
      if(gSz){document.querySelectorAll('.gl-ch').forEach(c=>c.classList.toggle('on',c.dataset.sz===gSz));updGSt();}
      if(gSk){document.getElementById('gSkB')?.classList.add('on');updGSt();}
      Object.keys(PD).forEach(renderGrid);
      showSec(cur);
      if(saved.scroll)setTimeout(()=>window.scrollTo({top:saved.scroll,behavior:'instant'}),80);
    },60);
  }
}

/* Show section */
function showSec(i){if(i<0)i=0;if(i>=SO.length)i=SO.length-1;cur=i;document.querySelectorAll('.sec').forEach((el,j)=>{el.classList.toggle('on',j===i);});updateProg();}

/* Image error fallbacks */
function imgErr(el){el.style.display='none';const fb=el.parentElement.querySelector('.pc-fb');if(fb)fb.style.display='flex';}
function eImgErr(el){el.style.display='none';const fb=el.parentElement.querySelector('.fb');if(fb)fb.style.display='flex';}

/* ===== RENDER PRODUCT GRID (Multi-Select) ===== */
function renderGrid(sid){
  const s=PD[sid],g=document.getElementById(sid+'G');if(!g)return;
  let h='';
  s.items.forEach(p=>{
    const k=sid+'-'+p.id;
    const q=cq[k]||1;
    const isSel=sel[sid]&&sel[sid]!=='skip'&&sel[sid][p.id];
    h+=`<div class="pc${isSel?' sel':''}" onclick="openDetail('${sid}','${p.id}')">
      <div class="pc-chk" onclick="event.stopPropagation();toggleProd('${sid}','${p.id}')"><i class="fas fa-check"></i></div>
      <div class="pc-img">
        <img src="${IP}${p.img}" alt="${p.name}" loading="lazy" onerror="imgErr(this)"/>
        <div class="pc-fb"><i class="fas fa-image"></i><span>${p.name}</span></div>
      </div>
      <div class="pc-body">
        <div class="pc-id">${p.id}</div>
        <div class="pc-nm">${p.name}</div>
        ${p.brand?'<div class="pc-brand">'+p.brand+'</div>':''}
        <div class="pc-ds">${p.desc}</div>
        <div class="pc-bot">
          <div class="pc-pr">${p.price.toLocaleString()} EGP</div>
          <div class="pq" onclick="event.stopPropagation()">
            <button onclick="chgQ('${sid}','${p.id}',-1)">−</button>
            <span id="cq-${k}">${q}</span>
            <button onclick="chgQ('${sid}','${p.id}',1)">+</button>
          </div>
        </div>
      </div>
    </div>`;
  });
  g.innerHTML=h;
  updSt(sid);
}

/* ===== RENDER ESSENTIALS ===== */
function renderEss(){
  const q=(document.getElementById('essSearch')?.value||'').toLowerCase();
  const g=document.getElementById('essG');if(!g)return;
  const f=ES.filter(e=>e.name.toLowerCase().includes(q)||e.id.toLowerCase().includes(q));
  g.innerHTML=f.map(e=>{
    const qt=ess[e.id]||0,rm=qt===0,nt=e.note?` — ${e.note}`:'';
    return`<div class="ei${rm?' rm':''}" onclick="openEssDetail('${e.id}')">
      <div class="ei-im"><img src="${IP}${e.img}" alt="${e.name}" loading="lazy" onerror="eImgErr(this)"/><div class="fb"><i class="fas fa-image"></i></div></div>
      <div class="ei-if"><div class="ei-id">${e.id}${nt}</div><div class="ei-nm">${e.name}</div><div class="ei-pr">${e.price.toLocaleString()} EGP</div></div>
      <div class="ei-ac" onclick="event.stopPropagation()">${rm
        ?`<button onclick="restE('${e.id}')" title="Add back"><i class="fas fa-plus"></i></button>`
        :`<button onclick="adjE('${e.id}',-1)">−</button><span class="ei-qt">${qt}</span><button onclick="adjE('${e.id}',1)">+</button><button class="ei-rm" onclick="rmE('${e.id}')" title="Remove"><i class="fas fa-xmark"></i></button>`
      }</div>
    </div>`;
  }).join('');
}

/* ===== PRODUCT DETAIL OVERLAY ===== */
function openDetail(sid,pid){
  const sec=PD[sid],prod=sec.items.find(i=>i.id===pid);
  if(!prod)return;
  const k=sid+'-'+pid;
  const qty=cq[k]||1;
  const isSel=sel[sid]&&sel[sid]!=='skip'&&!!sel[sid][pid];
  window._savedScroll=window.scrollY;

  const pn=document.getElementById('detPn');
  pn.innerHTML=`
    <div class="det-back" onclick="closeDetail()">
      <i class="fas fa-arrow-left"></i><span>Back</span>
    </div>
    <div class="det-img">
      <img src="${IP}${prod.img}" alt="${prod.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <div class="det-img-fb"><i class="fas fa-image"></i><span>${prod.name}</span></div>
    </div>
    <div class="det-info">
      <div class="det-id">${prod.id}</div>
      <div class="det-name">${prod.name}</div>
      ${prod.brand?`<div class="det-brand"><i class="fas fa-tag"></i> ${prod.brand}</div>`:''}
      <div class="det-desc">${prod.desc}</div>
      <div class="det-price-row">
        <span class="det-price">${prod.price.toLocaleString()}</span>
        <span class="det-price-cur">EGP</span>
      </div>
    </div>
    <div class="det-acts">
      <div class="det-qty-row">
        <span class="det-qty-label">Quantity</span>
        <div class="pq pq-lg">
          <button onclick="chgQ('${sid}','${pid}',-1);updDetQ('${k}')">−</button>
          <span id="dq-${k}">${qty}</span>
          <button onclick="chgQ('${sid}','${pid}',1);updDetQ('${k}')">+</button>
        </div>
      </div>
      <button class="det-btn ${isSel?'remove':'add'}" onclick="toggleProd('${sid}','${pid}');openDetail('${sid}','${pid}')">
        ${isSel?'<i class="fas fa-minus-circle"></i> Remove from Order':'<i class="fas fa-plus-circle"></i> Add to Order'}
      </button>
    </div>`;

  const ov=document.getElementById('detOv');
  ov.style.display='flex';
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{ov.classList.add('open');});
}

/* Essential product detail */
function openEssDetail(eid){
  const prod=ES.find(e=>e.id===eid);if(!prod)return;
  const qty=ess[eid]||0;
  const isAdded=qty>0;
  window._savedScroll=window.scrollY;

  const pn=document.getElementById('detPn');
  pn.innerHTML=`
    <div class="det-back" onclick="closeDetail()">
      <i class="fas fa-arrow-left"></i><span>Back</span>
    </div>
    <div class="det-img">
      <img src="${IP}${prod.img}" alt="${prod.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <div class="det-img-fb"><i class="fas fa-image"></i><span>${prod.name}</span></div>
    </div>
    <div class="det-info">
      <div class="det-id">${prod.id}${prod.note?' — '+prod.note:''}</div>
      <div class="det-name">${prod.name}</div>
      <div class="det-desc">Essential daily dental supply, pre-selected for your convenience.</div>
      <div class="det-price-row">
        <span class="det-price">${prod.price.toLocaleString()}</span>
        <span class="det-price-cur">EGP</span>
      </div>
    </div>
    <div class="det-acts">
      <div class="det-qty-row">
        <span class="det-qty-label">Quantity</span>
        <div class="pq pq-lg">
          <button onclick="adjE('${eid}',-1);updEssDetQ('${eid}')">−</button>
          <span id="deq-${eid}">${Math.max(qty,1)}</span>
          <button onclick="adjE('${eid}',1);updEssDetQ('${eid}')">+</button>
        </div>
      </div>
      <button class="det-btn ${isAdded?'remove':'add'}" onclick="${isAdded?`rmE('${eid}');openEssDetail('${eid}')`:`restE('${eid}');openEssDetail('${eid}')`}">
        ${isAdded?'<i class="fas fa-minus-circle"></i> Remove from Order':'<i class="fas fa-plus-circle"></i> Add to Order'}
      </button>
    </div>`;

  const ov=document.getElementById('detOv');
  ov.style.display='flex';
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{ov.classList.add('open');});
}

function updDetQ(k){const el=document.getElementById('dq-'+k);if(el)el.textContent=cq[k]||1;}
function updEssDetQ(eid){const el=document.getElementById('deq-'+eid);if(el)el.textContent=Math.max(ess[eid]||0,1);}

function closeDetail(){
  const ov=document.getElementById('detOv');
  ov.classList.remove('open');
  setTimeout(()=>{
    ov.style.display='none';
    document.body.style.overflow='';
    if(window._savedScroll!==undefined){
      window.scrollTo({top:window._savedScroll,behavior:'instant'});
      delete window._savedScroll;
    }
  },380);
}

/* Close detail on Escape */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('detOv').classList.contains('open'))closeDetail();
});

/* ===== INTERACTIONS ===== */

/* Toggle product selection (multi-select) */
function toggleProd(sid,pid){
  if(!sel[sid]||sel[sid]==='skip')sel[sid]={};
  const k=sid+'-'+pid;
  if(sel[sid][pid]){
    delete sel[sid][pid];
    /* If nothing selected, clean up */
    if(Object.keys(sel[sid]).length===0)delete sel[sid];
  }else{
    sel[sid][pid]=cq[k]||1;
  }
  renderGrid(sid);
  autoSave();
}

/* Change quantity on card */
function chgQ(sid,pid,d){
  const k=sid+'-'+pid;
  let v=(cq[k]||1)+d;
  if(v<1)v=1;if(v>99)v=99;
  cq[k]=v;
  /* Update in sel if selected */
  if(sel[sid]&&sel[sid]!=='skip'&&sel[sid][pid])sel[sid][pid]=v;
  /* Update card display */
  const el=document.getElementById('cq-'+k);if(el)el.textContent=v;
  updSt(sid);
  autoSave();
}

/* Skip section */
function skipSec(sid){
  sel[sid]='skip';
  renderGrid(sid);
  autoSave();
  showToast(SKIP_MSG[sid]);
  setTimeout(()=>goNext(sid),1200);
}
function skipG(){
  gSz='';gSk=true;
  document.querySelectorAll('.gl-ch').forEach(c=>c.classList.remove('on'));
  document.getElementById('gSkB')?.classList.add('on');
  updGSt();autoSave();
  showToast(SKIP_MSG.gloves);
  setTimeout(()=>goNext('gloves'),1200);
}

/* Gloves */
function setGS(sz){
  gSz=sz;gSk=false;
  document.querySelectorAll('.gl-ch').forEach(c=>c.classList.toggle('on',c.dataset.sz===sz));
  document.getElementById('gSkB')?.classList.remove('on');
  updGSt();enCont('gloves');autoSave();
}
function updGSt(){
  const el=document.getElementById('st-gloves');
  if(gSz)el.innerHTML=`<span class="ok"><i class="fas fa-check-circle"></i> Size: <strong>${gSz}</strong></span>`;
  else if(gSk)el.innerHTML=`<span class="sk">Skipped</span>`;
  else el.textContent='';
}

/* Essentials adjustments */
function adjE(id,d){let v=(ess[id]||1)+d;if(v<1)v=1;if(v>99)v=99;ess[id]=v;renderEss();autoSave();}
function rmE(id){ess[id]=0;renderEss();autoSave();}
function restE(id){ess[id]=1;renderEss();autoSave();}

/* Update status text (multi-select aware) */
function updSt(sid){
  const el=document.getElementById('st-'+sid);if(!el)return;
  const s=sel[sid];
  if(s==='skip'){
    el.innerHTML=`<span class="sk">Skipped</span>`;
  }else if(s&&typeof s==='object'){
    const keys=Object.keys(s);
    if(keys.length===0){
      el.textContent='';
      const b=document.getElementById('bc-'+sid);if(b)b.classList.remove('on','pulse');
    }else if(keys.length===1){
      const pid=keys[0],p=PD[sid].items.find(i=>i.id===pid);
      el.innerHTML=`<span class="ok"><i class="fas fa-check-circle"></i> ${p.id} (x${s[pid]})</span>`;
      enCont(sid);
    }else{
      const totalQ=Object.values(s).reduce((a,b)=>a+b,0);
      el.innerHTML=`<span class="ok"><i class="fas fa-check-circle"></i> ${keys.length} products selected (${totalQ} items)</span>`;
      enCont(sid);
    }
  }else{
    el.textContent='';
    const b=document.getElementById('bc-'+sid);if(b)b.classList.remove('on','pulse');
  }
}

function enCont(sid){const b=document.getElementById('bc-'+sid);if(b)b.classList.add('on','pulse');}

/* ===== NAVIGATION ===== */
function goNext(sid){
  const idx=SO.indexOf(sid);if(idx<0)return;
  /* Validate info form */
  if(sid==='info'){
    const nm=document.getElementById('f-name').value.trim(),
          ph=document.getElementById('f-phone').value.trim(),
          gn=document.querySelector('input[name="gender"]:checked')?.value,
          gv=document.getElementById('f-gov').value,
          ct=document.getElementById('f-city').value.trim(),
          ad=document.getElementById('f-addr').value.trim();
    if(!nm||!ph||!gn||!gv||!ct||!ad){
      const el=document.getElementById('s-info');
      el.style.animation='none';el.offsetHeight;el.style.animation='shake .4s ease';
      setTimeout(()=>el.style.animation='',400);
      showToast('⚠️ لازم تكمل كل البيانات المطلوبة عشان تقدر تكمل.');
      return;
    }
  }
  if(SO[idx+1]==='review')buildReview();
  showSec(idx+1);autoSave();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goBack(){if(cur<=0)return;showSec(cur-1);autoSave();window.scrollTo({top:0,behavior:'smooth'});}
function updateProg(){
  const p=((cur+1)/SO.length)*100;
  document.getElementById('pF').style.width=p+'%';
  document.getElementById('pL').textContent=`Step ${cur+1} / ${SO.length}  ·  ${SL[SO[cur]]}`;
}

/* ===== REVIEW & INVOICE ===== */
function getItems(){
  const items=[];
  Object.keys(PD).forEach(sid=>{
    const s=sel[sid];
    if(s&&s!=='skip'&&typeof s==='object'){
      Object.keys(s).forEach(pid=>{
        const p=PD[sid].items.find(i=>i.id===pid);
        if(p)items.push({id:p.id,name:p.name,price:p.price,qty:s[pid],variation:'',img:p.img});
      });
    }
  });
  if(gSz&&!gSk)items.push({id:'PPE-003',name:'Gloves',price:190,qty:1,variation:'Size: '+gSz,img:'--060.jpg'});
  ES.forEach(e=>{const q=ess[e.id]||0;if(q>0)items.push({id:e.id,name:e.name,price:e.price,qty:q,variation:e.note?'('+e.note+')':'',img:e.img});});
  return items;
}

function buildReview(){
  const items=getItems(),total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const nm=document.getElementById('f-name')?.value.trim()||'—',
        ph=document.getElementById('f-phone')?.value.trim()||'—',
        aph=document.getElementById('f-alt')?.value.trim()||'—',
        gn=document.querySelector('input[name="gender"]:checked')?.value||'—',
        gv=document.getElementById('f-gov')?.value||'—',
        ct=document.getElementById('f-city')?.value.trim()||'—',
        ad=document.getElementById('f-addr')?.value.trim()||'—',
        lm=document.getElementById('f-land')?.value.trim()||'—';
  let rows=items.map((it,i)=>`<tr><td>${i+1}</td><td style="text-align:left;font-weight:700;font-size:.65rem;color:var(--accent)">${it.id}</td><td style="text-align:left">${it.name}${it.variation?`<br><span style="font-size:.6rem;color:var(--text-s)">${it.variation}</span>`:''}</td><td>${it.qty}</td><td>${it.price.toLocaleString()}</td><td style="font-weight:700">${(it.price*it.qty).toLocaleString()}</td></tr>`).join('');
  document.getElementById('revC').innerHTML=`
    <div class="rv-s"><h4><i class="fas fa-user"></i> Customer Information</h4>
    <div class="rv-c">
      <div class="rr"><span class="rl">Name</span><span>${nm}</span></div>
      <div class="rr"><span class="rl">Phone</span><span>${ph}</span></div>
      <div class="rr"><span class="rl">Alt. Phone</span><span>${aph}</span></div>
      <div class="rr"><span class="rl">Gender</span><span>${gn}</span></div>
      <div class="rr"><span class="rl">Governorate</span><span>${gv}</span></div>
      <div class="rr"><span class="rl">City</span><span>${ct}</span></div>
      <div class="rr" style="grid-column:1/-1"><span class="rl">Address</span><span>${ad}${lm!=='—'?' — '+lm:''}</span></div>
    </div></div>
    <table class="rv-t"><thead><tr><th>#</th><th style="text-align:left">ID</th><th style="text-align:left">Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
    <tbody>${rows}<tr class="gr"><td colspan="5" style="text-align:right">Grand Total (EGP)</td><td>${total.toLocaleString()}</td></tr></tbody></table>`;
}

function genInvoice(){
  const items=getItems(),total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const invNum='CURA-'+Date.now().toString().slice(-6);
  const invDate=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const customer={name:document.getElementById('f-name').value.trim(),phone:document.getElementById('f-phone').value.trim(),altPhone:document.getElementById('f-alt').value.trim(),gender:document.querySelector('input[name="gender"]:checked')?.value||'',governorate:document.getElementById('f-gov').value,city:document.getElementById('f-city').value.trim(),address:document.getElementById('f-addr').value.trim(),landmark:document.getElementById('f-land').value.trim(),notes:document.getElementById('f-notes').value.trim()};
  localStorage.setItem('curaInvoice',JSON.stringify({invoiceNumber:invNum,invoiceDate:invDate,customer,items,total}));
  window.location.href='invoice.html';
}

function newOrder(){if(!confirm('Start a new order? All current selections will be cleared.'))return;localStorage.removeItem(SK);localStorage.removeItem('curaInvoice');location.reload();}
function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('thIco').className=d?'fas fa-moon':'fas fa-sun';localStorage.setItem('curaTheme',d?'light':'dark');}
(function(){const s=localStorage.getItem('curaTheme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('thIco').className='fas fa-sun';}})();

/* Scroll auto-save */
let _ss;window.addEventListener('scroll',()=>{clearTimeout(_ss);_ss=setTimeout(autoSave,400);});

/* Initialize */
buildApp();
</script>
</body>
</html>
