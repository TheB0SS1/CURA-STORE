const ES=ER.map(e=>({id:e[0],name:e[1],img:e[2],price:e[3],qty:e[4],note:e[5]}));
const SO=['intro','motor','contra','gloves','cast','box','torch','wax','lightcure','essentials','info','review'];
const SK='dentalState_v1'; 

let state = { cur: 0, sel: {}, ess: {}, gSz: '', gSk: false, form: {}, sq: '' };
ES.forEach(e => { if (state.ess[e.id] === undefined) state.ess[e.id] = e.qty; });

let _as;
function autoSave() { clearTimeout(_as); _as = setTimeout(saveState, 100); }
function saveState() { try { state.form = getForm(); state.sq = document.getElementById('essSearch')?.value || ''; localStorage.setItem(SK, JSON.stringify(state)); } catch (e) {} }
function getForm() {
    const f = {};
    ['f-name', 'f-phone', 'f-alt', 'f-city', 'f-addr', 'f-land', 'f-notes'].forEach(id => { const el = document.getElementById(id); if (el) f[id] = el.value; });
    const gv = document.getElementById('f-gov'); if (gv) f['f-gov'] = gv.value;
    const gn = document.querySelector('input[name="gender"]:checked'); if (gn) f.gender = gn.value;
    return f;
}
function setForm(f) { if (!f) return; Object.keys(f).forEach(k => { if (k === 'gender') { const r = document.querySelector(`input[name="gender"][value="${f[k]}"]`); if (r) r.checked = true; } else { const el = document.getElementById(k); if (el) el.value = f[k]; } }); }
function restoreState() { const raw = localStorage.getItem(SK); if (!raw) return false; try { const s = JSON.parse(raw); state = { ...state, ...s }; ES.forEach(e => { if (state.ess[e.id] === undefined) state.ess[e.id] = e.qty; }); return true; } catch (e) { return false; } }

let _tt;
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2500); }

function openDetail(item, type, sid) {
    const pn = document.getElementById('detPn'); const ov = document.getElementById('detOv');
    let h = `<div class="det-back" onclick="closeDetail()"><i class="fas fa-arrow-right"></i><span>Back</span></div>`;
    h += `<div class="det-img"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="det-img-fb" style="display:none"><i class="fas fa-image"></i><span>${item.name}</span></div></div>`;
    h += `<div class="det-info"><div class="det-id">${item.id}</div><div class="det-name">${item.name}</div>`;
    if (item.brand) h += `<div class="det-brand"><i class="fas fa-tag"></i> ${item.brand}</div>`;
    h += `<div class="det-desc">${item.desc || ''}</div>`;
    h += `<div class="det-price-row"><span class="det-price">${item.price.toLocaleString()}</span><span class="det-price-cur">EGP</span></div></div>`;
    h += `<div class="det-acts">`;
    if (type === 'pd') {
        const isSel = state.sel[sid] && Array.isArray(state.sel[sid]) && state.sel[sid].some(s => s.id === item.id);
        const q = isSel ? state.sel[sid].find(s => s.id === item.id).qty || 1 : 1;
        if (isSel) {
            h += `<div class="det-qty-row"><span class="det-qty-label">Quantity</span><div class="pq pq-lg"><button onclick="detCqPd('${sid}','${item.id}',-1)">−</button><span id="detQ">${q}</span><button onclick="detCqPd('${sid}','${item.id}',1)">+</button></div></div>`;
            h += `<button class="det-btn remove" onclick="toggleSel('${sid}','${item.id}');closeDetail()"><i class="fas fa-trash"></i> Remove from Package</button>`;
        } else {
            h += `<button class="det-btn add" onclick="toggleSel('${sid}','${item.id}');closeDetail()"><i class="fas fa-plus"></i> Add to Package</button>`;
        }
    } else if (type === 'ess') {
        const q = state.ess[item.id] || 0; const isRm = q === 0;
        if (isRm) {
            h += `<button class="det-btn restore" onclick="state.ess['${item.id}']=ES.find(e=>e.id==='${item.id}')?.qty||1;renderEss();autoSave();closeDetail()"><i class="fas fa-plus"></i> Restore Item</button>`;
        } else {
            h += `<div class="det-qty-row"><span class="det-qty-label">Quantity</span><div class="pq pq-lg"><button onclick="detEssCh('${item.id}',-1)">−</button><span id="detQ">${q}</span><button onclick="detEssCh('${item.id}',1)">+</button></div></div>`;
            h += `<button class="det-btn remove" onclick="state.ess['${item.id}']=0;renderEss();autoSave();closeDetail()"><i class="fas fa-trash"></i> Remove from Essentials</button>`;
        }
    }
    h += `</div>`;
    pn.innerHTML = h; ov.classList.add('open');
}
function detCqPd(sid, id, d) { if (!state.sel[sid] || !Array.isArray(state.sel[sid])) return; const it = state.sel[sid].find(x => x.id === id); if (!it) return; it.qty = Math.max(1, it.qty + d); const qEl = document.getElementById('detQ'); if (qEl) qEl.textContent = it.qty; renderGrid(sid); autoSave(); }
function detEssCh(id, d) { if (!state.ess[id] || state.ess[id] <= 0) return; state.ess[id] = Math.max(1, state.ess[id] + d); const qEl = document.getElementById('detQ'); if (qEl) qEl.textContent = state.ess[id]; renderEss(); autoSave(); }
function closeDetail() { document.getElementById('detOv').classList.remove('open'); }

function toggleSel(sid, id) {
    if (!state.sel[sid]) state.sel[sid] = [];
    const idx = state.sel[sid].findIndex(x => x.id === id);
    if (idx > -1) { state.sel[sid].splice(idx, 1); } 
    else { const item = PD[sid].items.find(x => x.id === id); if (item) state.sel[sid].push({ id: item.id, qty: 1 }); }
    renderGrid(sid); autoSave();
}

function renderGrid(sid) {
    const g = document.getElementById(sid + 'G'); if (!g) return;
    const items = PD[sid]?.items || [];
    g.innerHTML = items.map(item => {
        const isSel = state.sel[sid] && state.sel[sid].some(x => x.id === item.id);
        const q = isSel ? state.sel[sid].find(x => x.id === item.id).qty : 1;
        return `<div class="pc ${isSel ? 'sel' : ''}" onclick="openDetail(PD['${sid}'].items.find(i=>i.id==='${item.id}'),'pd','${sid}')">
            <div class="pc-top"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="pc-top-fb" style="display:none"><i class="fas fa-image"></i><span>${item.name}</span></div></div>
            <div class="pc-body"><div class="pc-id">${item.id}</div><div class="pc-nm">${item.name}</div><div class="pc-ds">${item.desc}</div></div>
            <div class="pc-bot"><span class="pc-pr">${item.price.toLocaleString()} EGP</span></div>
            <div class="pc-add"><span class="pc-add-n"><i class="fas fa-plus"></i> Add</span><span class="pc-add-d"><i class="fas fa-check"></i> Added</span></div>
        </div>`;
    }).join('');
    
    const stEl = document.getElementById('st-' + sid);
    const bcEl = document.getElementById('bc-' + sid);
    const hasSel = state.sel[sid] && state.sel[sid].length > 0;
    
    if (stEl) { stEl.textContent = hasSel ? `✅ Selected ${state.sel[sid].length} item(s)` : ''; stEl.className = 'st ' + (hasSel ? 'ok' : ''); }
    if (bcEl) bcEl.classList.add('on');
}

function renderEss() {
    const g = document.getElementById('essG'); if (!g) return;
    const sq = (document.getElementById('essSearch')?.value || '').toLowerCase();
    const items = ES.filter(e => state.ess[e.id] > 0 && (e.name.toLowerCase().includes(sq) || e.id.toLowerCase().includes(sq)));
    const itemsRm = ES.filter(e => state.ess[e.id] <= 0 && (e.name.toLowerCase().includes(sq) || e.id.toLowerCase().includes(sq)));
    
    g.innerHTML = items.map(item => `
        <div class="ei" onclick="openDetail(ES.find(e=>e.id==='${item.id}'),'ess')">
            <div class="ei-im"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none'"/></div>
            <div class="ei-if"><div class="ei-id">${item.id}</div><div class="ei-nm">${item.name}</div><div class="ei-pr">${item.price.toLocaleString()} EGP</div></div>
            <div class="ei-ac"><button onclick="event.stopPropagation();essCh('${item.id}',-1)">−</button><span class="ei-qt">${state.ess[item.id]}</span><button onclick="event.stopPropagation();essCh('${item.id}',1)">+</button></div>
        </div>`).join('') + itemsRm.map(item => `
        <div class="ei rm" onclick="state.ess['${item.id}']=ES.find(e=>e.id==='${item.id}')?.qty||1;renderEss();autoSave()">
            <div class="ei-im"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none'"/></div>
            <div class="ei-if"><div class="ei-id">${item.id}</div><div class="ei-nm">${item.name}</div><div class="ei-pr">${item.price.toLocaleString()} EGP</div></div>
            <div class="ei-ac"><button class="ei-rm"><i class="fas fa-undo"></i></button></div>
        </div>`).join('');
}

function essCh(id, d) {
    if (state.ess[id] === undefined) return;
    state.ess[id] = Math.max(0, state.ess[id] + d);
    renderEss(); autoSave();
}

function setGS(sz) {
    state.gSz = state.gSz === sz ? '' : sz;
    state.gSk = false;
    document.querySelectorAll('.gl-ch').forEach(c => c.classList.toggle('on', c.dataset.sz === state.gSz));
    document.getElementById('gSkB')?.classList.remove('on');
    autoSave();
}

function skipG() {
    state.gSk = true; state.gSz = '';
    document.querySelectorAll('.gl-ch').forEach(c => c.classList.remove('on'));
    document.getElementById('gSkB')?.classList.add('on');
    autoSave();
}

function goNext(sid) {
    if (sid === 'motor') {
        const motorSelected = state.sel['motor'] && state.sel['motor'].length > 0;
        if (motorSelected) {
            state.sel['contra'] = []; // Skip contra logic
            state.cur += 2; // Skip contra step
        } else {
            state.cur += 1; // Go to contra step
        }
    } else {
        state.cur += 1;
    }
    showStep();
    autoSave();
}

function skipSec(sid) {
    if (SKIP_MSG[sid]) showToast(SKIP_MSG[sid]);
    state.sel[sid] = [];
    state.cur += 1;
    showStep();
    autoSave();
}

function goBack() {
    if (state.cur > 0) { state.cur -= 1; showStep(); autoSave(); }
}

function showStep() {
    const sid = SO[state.cur];
    document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
    const sec = document.getElementById('s-' + sid);
    if (sec) { sec.classList.add('on'); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    
    // Render grids
    if (PD[sid]) renderGrid(sid);
    if (sid === 'gloves') {
        document.querySelectorAll('.gl-ch').forEach(c => c.classList.toggle('on', c.dataset.sz === state.gSz));
        if (state.gSk) document.getElementById('gSkB')?.classList.add('on');
        const bcEl = document.getElementById('bc-gloves'); if(bcEl) bcEl.classList.add('on');
    }
    if (sid === 'essentials') renderEss();
    if (sid === 'review') renderReview();
    
    // Progress
    const pF = document.getElementById('pF'); const pL = document.getElementById('pL');
    const p = ((state.cur + 1) / SO.length) * 100;
    pF.style.width = p + '%';
    pL.textContent = `Step ${state.cur + 1} / ${SO.length}`;
}

function calcTotal() {
    let total = 0;
    // Primary selections
    Object.keys(state.sel).forEach(sid => {
        if (state.sel[sid] && Array.isArray(state.sel[sid])) {
            state.sel[sid].forEach(s => {
                const item = PD[sid]?.items.find(i => i.id === s.id);
                if (item) total += item.price * s.qty;
            });
        }
    });
    // Gloves
    if (state.gSz) total += GLOVE_PRICE;
    // Essentials
    ES.forEach(e => { total += e.price * (state.ess[e.id] || 0); });
    return total;
}

function renderReview() {
    const app = document.getElementById('review-content');
    let html = '<div class="rv-s"><h4>Selected Items</h4><div class="rv-c">';
    let hasItems = false;

    Object.keys(state.sel).forEach(sid => {
        if (state.sel[sid] && Array.isArray(state.sel[sid]) && state.sel[sid].length > 0) {
            state.sel[sid].forEach(s => {
                const item = PD[sid]?.items.find(i => i.id === s.id);
                if (item) { hasItems = true; html += `<div class="rr"><span class="rl">${item.name} × ${s.qty}</span><span>${(item.price * s.qty).toLocaleString()} EGP</span></div>`; }
            });
        }
    });

    if (state.gSz) { hasItems = true; html += `<div class="rr"><span class="rl">Gloves Latex (${state.gSz})</span><span>${GLOVE_PRICE.toLocaleString()} EGP</span></div>`; }

    ES.forEach(e => { if (state.ess[e.id] > 0) { hasItems = true; html += `<div class="rr"><span class="rl">${e.name} × ${state.ess[e.id]}</span><span>${(e.price * state.ess[e.id]).toLocaleString()} EGP</span></div>`; } });

    if (!hasItems) html += '<div class="rr"><span class="rl">No items selected</span><span>0 EGP</span></div>';
    html += '</div></div>';

    html += `<div style="text-align:right;font-size:1.2rem;font-weight:900;color:var(--gold);margin-top:16px">Total: ${calcTotal().toLocaleString()} EGP</div>`;
    
    html += `<div class="ig" style="margin-top:24px">
        <div class="fl"><label>Name</label><input type="text" id="f-name" placeholder="Full Name"></div>
        <div><label>Phone</label><input type="tel" id="f-phone" placeholder="01xxxxxxxxx"></div>
        <div><label>Alt Phone</label><input type="tel" id="f-alt" placeholder="Optional"></div>
        <div class="fl"><label>Address</label><input type="text" id="f-addr" placeholder="Street, Building"></div>
        <div><label>City</label><input type="text" id="f-city" placeholder="City"></div>
        <div><label>Notes</label><textarea id="f-notes" placeholder="Any special requests..."></textarea></div>
    </div>`;

    app.innerHTML = html;
    setForm(state.form);
}

function buildApp() {
    const app = document.getElementById('app'); app.innerHTML = ''; let n = 0;
    function secHTML(sid, num, title, desc, gridId, skippable) {
        return `<div class="sec" id="s-${sid}"><div class="s-hdr"><div class="s-b">${num}</div><div><div class="s-t">${title}</div><div class="s-d">${desc}</div></div></div><div class="pr" id="${gridId}"></div><div class="st" id="st-${sid}"></div><div class="sn"><button class="b-bk" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>${skippable ? `<button class="b-sk" onclick="skipSec('${sid}')">تخطي هذه الخطوة</button>` : ''}<button class="b-co" id="bc-${sid}" onclick="goNext('${sid}')">Continue <i class="fas fa-arrow-right"></i></button></div></div>`;
    }

    n++; app.innerHTML += `<div class="sec" id="s-intro"><div class="intro-w"><h2>أهلاً بك في متجر أدوات الأسنان</h2><p>إليك كيف يعمل الموقع في خطوات بسيطة:</p><div class="intro-steps"><div class="intro-step"><i class="fas fa-hand-pointer"></i><h4>1. اختر الأدوات</h4><p>تصفح الأقسام واختر الأدوات اللي تحتاجها.</p></div><div class="intro-step"><i class="fas fa-sort-numeric-up"></i><h4>2. حدد الكميات</h4><p>اضغط على الأداة لزيادة أو تقليل الكمية.</p></div><div class="intro-step"><i class="fas fa-truck-fast"></i><h4>3. أدخل بياناتك</h4><p>اكتب بيانات التوصيل بشكل صحيح علشان نوصل لك.</p></div><div class="intro-step"><i class="fas fa-file-invoice-dollar"></i><h4>4. استلم الفاتورة</h4><p>هتنتقل لصفحة الفاتورة النهائية لتأكيد طلبك وطباعته.</p></div></div><div class="sn"><button class="b-co on" style="width:100%;justify-content:center" onclick="goNext('intro')">ابدأ الآن <i class="fas fa-arrow-left"></i></button></div></div></div>`;

    n++; app.innerHTML += secHTML('motor', n, PD.motor.title, PD.motor.desc, 'motorG', true);
    n++; app.innerHTML += secHTML('contra', n, PD.contra.title, PD.contra.desc, 'contraG', true);
    
    n++; app.innerHTML += `<div class="sec" id="s-gloves"><div class="s-hdr"><div class="s-b">${n}</div><div><div class="s-t">Gloves Latex</div><div class="s-d">اختار مقاس الجوانتي المناسب، أو تخطي الخطوة.</div></div></div><div class="gl-w"><div class="gl-img"><img src="${IP}t-03.jpg" alt="Gloves" onerror="this.style.display='none'"/></div><div class="gl-chips" id="gC">${['Small', 'Medium', 'Large', 'X-Large'].map(sz => `<div class="gl-ch" data-sz="${sz}" onclick="setGS('${sz}')">${sz}</div>`).join('')}</div><div class="gl-price"><span style="font-weight:800;font-size:.92rem;color:var(--gold)">${GLOVE_PRICE.toLocaleString()}</span><span style="font-size:.72rem;font-weight:600;color:var(--text-s);margin-left:3px">EGP</span></div><button class="gl-sk" id="gSkB" onclick="skipG()">تخطي (بدون إضافة جوانتي)</button></div><div class="st" id="st-gloves"></div><div class="sn"><button class="b-bk" onclick="goBack()"><i class="fas fa-arrow-left"></i></button><button class="b-sk" onclick="skipG();skipSec('gloves')">تخطي هذه الخطوة</button><button class="b-co" id="bc-gloves" onclick="goNext('gloves')">Continue <i class="fas fa-arrow-right"></i></button></div></div>`;

    n++; app.innerHTML += secHTML('cast', n, PD.cast.title, PD.cast.desc, 'castG', true);
    n++; app.innerHTML += secHTML('box', n, PD.box.title, PD.box.desc, 'boxG', true);
    n++; app.innerHTML += secHTML('torch', n, PD.torch.title, PD.torch.desc, 'torchG', true);
    n++; app.innerHTML += secHTML('wax', n, PD.wax.title, PD.wax.desc, 'waxG', true);
    n++; app.innerHTML += secHTML('lightcure', n, PD.lightcure.title, PD.lightcure.desc, 'lightcureG', true);

    n++; app.innerHTML += `<div class="sec" id="s-essentials"><div class="s-hdr"><div class="s-b">${n}</div><div><div class="s-t">الأدوات الأساسية</div><div class="s-d">كل الأدوات الأساسية التانية اللي ممكن تحتاجها. اضغط على الأداة عشان تتحكم في العدد.</div></div></div><input type="text" class="sb" id="essSearch" placeholder="🔍 Search instruments..." oninput="renderEss()"><div class="eg" id="essG"></div><div class="sn"><button class="b-bk" onclick="goBack()"><i class="fas fa-arrow-left"></i></button><button class="b-co on" onclick="goNext('essentials')">Continue <i class="fas fa-arrow-right"></i></button></div></div>`;

    n++; app.innerHTML += `<div class="sec" id="s-info"><div class="s-hdr"><div class="s-b">${n}</div><div><div class="s-t">بيانات التوصيل</div><div class="s-d">اكتب بياناتك علشان نقدر نوصل الطلب.</div></div></div><div id="info-content"></div><div class="sn"><button class="b-bk" onclick="goBack()"><i class="fas fa-arrow-left"></i></button><button class="b-co on" onclick="goNext('info')">Review Order <i class="fas fa-arrow-right"></i></button></div></div>`;

    n++; app.innerHTML += `<div class="sec" id="s-review"><div class="s-hdr"><div class="s-b">${n}</div><div><div class="s-t">مراجعة الطلب</div><div class="s-d">تأكد من طلبك قبل التأكيد.</div></div></div><div id="review-content"></div><div class="sn"><button class="b-bk" onclick="goBack()"><i class="fas fa-arrow-left"></i></button><button class="b-co on" onclick="window.print()"><i class="fas fa-print"></i> Print Invoice</button></div></div>`;

    restoreState();
    showStep();
}

function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('thIco').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
}

function newOrder() {
    if(confirm('هل أنت متأكد من مسح الطلب الحالي وبدء طلب جديد؟')) {
        localStorage.removeItem(SK);
        state = { cur: 0, sel: {}, ess: {}, gSz: '', gSk: false, form: {}, sq: '' };
        ES.forEach(e => { state.ess[e.id] = e.qty; });
        buildApp();
    }
}

buildApp();
</script>
</body>
</html>
