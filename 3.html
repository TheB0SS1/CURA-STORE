<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f8;--surface:#ffffff;--text:#0f172a;--text-s:#64748b;--border:#e2e8f0;--primary:#0f172a;--accent:#0d9488;--accent-l:rgba(13,148,136,.06);--accent-m:rgba(13,148,136,.12);--gold:#b45309;--gold-l:rgba(180,83,9,.06);--danger:#dc2626;--danger-l:rgba(220,38,38,.06);--sh-xs:0 1px 2px rgba(15,23,42,.03);--sh-s:0 2px 4px rgba(15,23,42,.04);--sh-m:0 4px 12px rgba(15,23,42,.06);--sh-lg:0 8px 24px rgba(15,23,42,.08);--sh-xl:0 16px 48px rgba(15,23,42,.12);--r:20px;--rs:14px;--pill:100px;--tr:.3s cubic-bezier(.4,0,.2,1)}

::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

let _as;
function autoSave() { clearTimeout(_as); _as = setTimeout(saveState, 100); }
function saveState() { try { state.form = getForm(); localStorage.setItem(SK, JSON.stringify(state)); } catch (e) {} }
function getForm() {
    const f = {};
    ['f-name', 'f-phone', 'f-alt', 'f-city', 'f-addr', 'f-land', 'f-notes', 'f-gov'].forEach(id => { const el = document.getElementById(id); if (el) f[id] = el.value; });
    const gn = document.querySelector('input[name="gender"]:checked'); if (gn) f.gender = gn.value;
    return f;
}
function setForm(f) { if (!f) return; Object.keys(f).forEach(k => { if (k === 'gender') { const r = document.querySelector(`input[name="gender"][value="${f[k]}"]`); if (r) r.checked = true; } else { const el = document.getElementById(k); if (el) el.value = f[k]; } }); }
function restoreState() { const raw = localStorage.getItem(SK); if (!raw) return false; try { const s = JSON.parse(raw); state = { ...state, ...s }; ES.forEach(e => { if (state.ess[e.id] === undefined) state.ess[e.id] = e.qty; }); return true; } catch (e) { return false; } }

let _tt;
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 1800); }

function renderGrid(sid) {
    const g = document.getElementById(sid + 'G'); if (!g) return;
    const items = PD[sid]?.items || [];
    g.innerHTML = items.map(item => {
        const isSel = state.sel[sid] && state.sel[sid].includes(item.id);
        return `<div class="pc ${isSel ? 'sel' : ''}" onclick="toggleSel('${sid}','${item.id}')">
            <div class="pc-top"><img src="${IP}${item.img}" alt="${item.name}" onerror="this.style.display='none'"/></div>
            <div class="pc-body"><div class="pc-nm">${item.name}</div><div class="pc-pr">${item.price.toLocaleString()} EGP</div></div>
            <div class="pc-add"><span class="pc-add-n"><i class="fas fa-plus"></i> Add</span><span class="pc-add-d"><i class="fas fa-check"></i> Added</span></div>
        </div>`;
    }).join('');
    
    const stEl = document.getElementById('st-' + sid);
    const bcEl = document.getElementById('bc-' + sid);
    const hasSel = state.sel[sid] && state.sel[sid].length > 0;
    if (stEl) { stEl.textContent = hasSel ? `✅ Selected` : ''; stEl.className = 'st ' + (hasSel ? 'ok' : ''); }
    if (bcEl) {
        if (hasSel) bcEl.classList.add('on');
        else bcEl.classList.remove('on');
    }
}

function renderEss() {
    const g = document.getElementById('essG'); if (!g) return;

    const items = ES.filter(e => state.ess[e.id] > 0 && (e.name.toLowerCase().includes(sq) || e.id.toLowerCase().includes(sq)));
    const itemsRm = ES.filter(e => state.ess[e.id] <= 0 && (e.name.toLowerCase().includes(sq) || e.id.toLowerCase().includes(sq)));
    
    g.innerHTML = items.map(item => `

function openEssDetail(id) {
    const item = ES.find(e => e.id === id);
    if(!item) return;
    const q = state.ess[id] || 0;
    let h = `<div style="padding:24px;direction:rtl;text-align:right">`;
    h += `<h3 style="margin-bottom:12px;text-align:center">${item.name}</h3>`;
    h += `<p style="color:var(--gold);margin-bottom:12px;text-align:center;font-weight:800;font-size:1.1rem">${item.price.toLocaleString()} EGP</p>`;
    if(item.note) h += `<div class="sc-note" style="margin-bottom:12px">${item.note}</div>`;
    h += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center"><button class="b-bk" onclick="essCh('${id}',-1);renderEss();document.getElementById('essModal').remove()">−</button><strong>${q}</strong><button class="b-bk" onclick="essCh('${id}',1);renderEss();document.getElementById('essModal').remove()">+</button></div>`;
    h += `</div>`;
    const modal = document.createElement('div'); modal.id = 'essModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center';
    modal.innerHTML = `<div style="background:var(--surface);border-radius:var(--r);max-width:400px;width:90%;box-shadow:var(--sh-xl)">${h}</div>`;
    modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
    document.body.appendChild(modal);
}

function essCh(id, d) {
    if (state.ess[id] === undefined) return;
    const oldQty = state.ess[id];
    state.ess[id] = Math.max(0, state.ess[id] + d);
    
    const item = ES.find(e => e.id === id);
    if (d > 0 && state.ess[id] > oldQty) {
        showToast('✅ تم إضافة ' + (item?.name || ''));
    } else if (d < 0 && state.ess[id] < oldQty) {
        showToast('تم إزالة ' + (item?.name || ''));
    }
    autoSave();
}

function toggleSel(sid, id) {
    if (!state.sel[sid]) state.sel[sid] = [];
    const item = PD[sid]?.items.find(i => i.id === id);
    
    if (sid === 'motorcontra') {
        if (state.sel[sid].includes(id)) {
            state.sel[sid] = [];
            showToast('تم إزالة ' + (item?.name || ''));
        } else {
            state.sel[sid] = [id];
            showToast('✅ تم إضافة ' + (item?.name || ''));
        }
    } else {
        const idx = state.sel[sid].indexOf(id);
        if (idx > -1) {
            state.sel[sid].splice(idx, 1); 
            showToast('تم إزالة ' + (item?.name || ''));
        } else {
            state.sel[sid].push(id);
            showToast('✅ تم إضافة ' + (item?.name || ''));
        }
    }
    renderGrid(sid); autoSave();
}

function setGS(sz) {
    state.gSz = state.gSz === sz ? '' : sz;
    state.gSk = false;
    document.querySelectorAll('.gl-ch').forEach(c => c.classList.toggle('on', c.dataset.sz === state.gSz));
    if (state.gSz) {
        showToast('✅ تم إضافة Gloves Latex - مقاس ' + sz);
        const bcEl = document.getElementById('bc-gloves'); if(bcEl) bcEl.classList.add('on');
    } else {
        showToast('تم إزالة Gloves Latex');
        const bcEl = document.getElementById('bc-gloves'); if(bcEl) bcEl.classList.remove('on');
    }
    autoSave();
}

function skipG() {
    state.gSk = true; state.gSz = '';
    document.querySelectorAll('.gl-ch').forEach(c => c.classList.remove('on'));
    const bcEl = document.getElementById('bc-gloves'); if(bcEl) bcEl.classList.remove('on');
    autoSave();
}

function goNext(sid) {
    state.cur += 1;
    showStep(); autoSave();
}

function skipSec(sid) {
    state.sel[sid] = [];
    if(sid === 'gloves') { state.gSk = true; state.gSz = ''; }
    state.cur += 1;
    showStep(); autoSave();
}

function goBack() {
    if (state.cur > 0) { state.cur -= 1; showStep(); autoSave(); }
}

function showStep() {
    const sid = SO[state.cur];
    document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
    const sec = document.getElementById('s-' + sid);
    if (sec) { sec.classList.add('on'); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    
    if (PD[sid]) renderGrid(sid);
    if (sid === 'gloves') {
        document.querySelectorAll('.gl-ch').forEach(c => c.classList.toggle('on', c.dataset.sz === state.gSz));
        const bcEl = document.getElementById('bc-gloves');
        if (state.gSz) bcEl?.classList.add('on');
        else bcEl?.classList.remove('on');
    }
    if (sid === 'essentials') renderEss();
    if (sid === 'info') setForm(state.form);
    
    const pF = document.getElementById('pF'); const pL = document.getElementById('pL');
    const p = ((state.cur + 1) / SO.length) * 100;
    pF.style.width = p + '%';
    pL.textContent = `Step ${state.cur + 1} / ${SO.length}`;
}

                    const qty = 1;
                    const itemTotal = item.price * qty;
                    items.push({ id: item.id, name: item.name, variation: variation, price: item.price, qty: qty });
                    total += itemTotal;
                }
            });
        }
    });

    if (state.gSz && !state.sel['gloves']) {
        const itemTotal = GLOVE_PRICE;
        items.push({ id: 'T-03', name: 'Gloves Latex', variation: 'Size: ' + state.gSz, price: GLOVE_PRICE, qty: 1 });
        total += itemTotal;
    }

    ES.forEach(e => {
        const qty = state.ess[e.id] || 0;
        if (qty > 0) {
            const itemTotal = e.price * qty;
            items.push({ id: e.id, name: e.name, variation: '', price: e.price, qty: qty });
            total += itemTotal;
        }
    });

    const invoiceData = {
        invoiceNumber: 'INV-' + Date.now().toString().slice(-6),
        invoiceDate: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
        customer: {
            name: form['f-name'] || 'N/A',
            phone: form['f-phone'] || 'N/A',
            altPhone: form['f-alt'] || '',
            gender: form.gender || 'Male',
            governorate: form['f-gov'] || '',
            city: form['f-city'] || '',
            address: form['f-addr'] || '',
            landmark: form['f-land'] || '',
            notes: form['f-notes'] || ''
        },
        items: items,
        total: total
    };

    localStorage.setItem('curaInvoice', JSON.stringify(invoiceData));
    window.location.href = '33.html';
}

function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('thIco').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
}

function newOrder() {
    if(confirm('هل أنت متأكد من مسح الطلب الحالي وبدء طلب جديد؟')) {
        localStorage.removeItem(SK);
        state = { cur: 0, sel: {}, ess: {}, gSz: '', gSk: false, form: {} };
        ES.forEach(e => { state.ess[e.id] = e.qty; });
        buildApp();
    }
}

buildApp();
</script>
