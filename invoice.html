<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cura Store — Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,sans-serif;background:#e8ecf2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px 60px}
    .top-bar{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .top-bar a{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:60px;border:1px solid #c8d0dc;background:#fff;color:#0a1628;font-size:.78rem;font-weight:600;text-decoration:none;transition:.2s}
    .top-bar a:hover{border-color:#0d2137;background:#f0f3f8}

    /* ===== VISIBLE INVOICE (for on-screen display) ===== */
    .inv-wrap{width:100%;max-width:780px;background:#fff;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.1);padding:48px 44px;color:#0a1628}
    .inv-hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0d2137;padding-bottom:18px;margin-bottom:24px;flex-wrap:wrap;gap:16px}
    .inv-logo{font-size:2.2rem;font-weight:900;color:#0a1628;letter-spacing:-.5px}
    .inv-logo span{font-weight:300;color:#1a8a7d}
    .inv-sub{font-size:.7rem;color:#5a6b80;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
    .inv-meta{text-align:right}
    .inv-meta .inum{font-size:.82rem;font-weight:700;color:#0a1628}
    .inv-meta .idate{font-size:.75rem;color:#5a6b80;margin-top:3px}
    .ict{font-size:.7rem;font-weight:700;color:#1a8a7d;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
    .icg{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px;margin-bottom:24px;font-size:.82rem}
    .icg .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #dfe5ee}
    .icg .l{color:#5a6b80;font-weight:500}
    .icg .v{font-weight:600;color:#0a1628;text-align:right}
    .idiv{border:none;border-top:1px solid #dfe5ee;margin:20px 0}
    .it{width:100%;border-collapse:collapse;font-size:.8rem}
    .it thead th{background:#0d2137;color:#fff;padding:10px 8px;text-align:center;font-weight:700;font-size:.7rem;letter-spacing:.3px;text-transform:uppercase}
    .it thead th:nth-child(2){text-align:left}
    .it thead th:nth-child(3){text-align:left}
    .it tbody td{padding:9px 8px;text-align:center;border-bottom:1px solid #eef1f6;color:#0a1628}
    .it tbody td:nth-child(2){text-align:left;font-weight:700;font-size:.7rem;color:#1a8a7d}
    .it tbody td:nth-child(3){text-align:left}
    .it tbody tr:nth-child(even) td{background:#f8fafc}
    .it .gr td{font-weight:900;font-size:1.05rem;background:#f5f0e8;border-top:3px solid #b8863e;color:#8a6a2a;padding:12px 8px}
    .it .gr td:last-child{text-align:center}
    .inv-ft{margin-top:28px;padding-top:16px;border-top:1px solid #dfe5ee;text-align:center;font-size:.68rem;color:#5a6b80;line-height:1.6}
    .inv-ft strong{color:#0a1628}

    /* ===== ACTION BUTTONS ===== */
    .acts{width:100%;max-width:780px;margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .btn-dl{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;border-radius:60px;border:none;background:#0d2137;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;transition:.25s;font-family:inherit}
    .btn-dl:hover{background:#1a8a7d;transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,138,125,.25)}
    .btn-dl:active{transform:translateY(0) scale(.98)}
    .btn-dl:disabled{opacity:.5;pointer-events:none}
    .btn-dl .sp{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    .btn-dl.ld .sp{display:inline-block}
    .btn-dl.ld .bt{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== CONFIRMATION OVERLAY ===== */
    .co{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
    .co.open{display:flex;animation:fi .35s ease}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    .cc{background:#fff;border-radius:20px;padding:36px 32px;max-width:480px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.2);animation:su .4s cubic-bezier(.22,1,.36,1)}
    @keyframes su{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .ci{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;background:#e8f8f6;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#1a8a7d}
    .cc h3{font-size:1.15rem;font-weight:800;color:#0a1628;margin-bottom:12px}
    .cc p{font-size:.88rem;color:#5a6b80;line-height:1.75;margin-bottom:8px;direction:rtl;text-align:right}
    .cc .rn{font-size:.75rem;color:#1a8a7d;font-weight:600;margin-top:16px}
    .cc .rn i{margin-left:4px}

    /* ===== NO DATA ===== */
    .nd{text-align:center;padding:60px 20px}
    .nd i{font-size:3rem;color:#c8d0dc;margin-bottom:16px}
    .nd h2{font-size:1.3rem;font-weight:700;color:#0a1628;margin-bottom:8px}
    .nd p{color:#5a6b80;font-size:.88rem}
    .nd a{color:#1a8a7d;font-weight:700}

    @media(max-width:600px){
      .inv-wrap{padding:28px 20px}
      .inv-hdr{flex-direction:column}
      .inv-meta{text-align:left}
      .icg{grid-template-columns:1fr}
      .it{font-size:.7rem}
      .it thead th,.it tbody td{padding:7px 4px}
      .inv-logo{font-size:1.8rem}
    }
    @media print{
      body{background:#fff;padding:0}
      .top-bar,.acts,.co{display:none!important}
      .inv-wrap{box-shadow:none;border-radius:0;max-width:100%}
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="fourth-year.html"><i class="fas fa-arrow-left"></i> Back to Store</a>
</div>

<div id="invArea"></div>

<div class="acts" id="actsArea" style="display:none">
  <button class="btn-dl" id="dlBtn" onclick="dlInv()">
    <span class="sp"></span>
    <span class="bt"><i class="fas fa-download"></i> Download Invoice as PNG</span>
  </button>
</div>

<!-- Confirmation Overlay -->
<div class="co" id="coOverlay">
  <div class="cc">
    <div class="ci"><i class="fas fa-circle-check"></i></div>
    <h3>Invoice Downloaded</h3>
    <p>تم تنزيل الفاتورة بنجاح.</p>
    <p>يرجى إرسال صورة الفاتورة إلى مسؤول تأكيد الطلب لاستكمال إجراءات الطلب ومتابعة الشحن.</p>
    <div class="rn"><i class="fab fa-whatsapp"></i> Redirecting to WhatsApp...</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function() {
  var raw = localStorage.getItem('curaInvoice');
  if (!raw) {
    document.getElementById('invArea').innerHTML =
      '<div class="nd"><i class="fas fa-file-circle-exclamation"></i><h2>No Invoice Data Found</h2><p>Please start from the <a href="fourth-year.html">product page</a> to build your order first.</p></div>';
    return;
  }

  var d = JSON.parse(raw);
  var inum = d.invoiceNumber;
  var idate = d.invoiceDate;
  var c = d.customer;
  var items = d.items;
  var total = d.total;

  // Customer info rows
  var cf = [
    ['Name', c.name],
    ['Phone', c.phone],
    ['Alt. Phone', c.altPhone || '—'],
    ['Gender', c.gender || '—'],
    ['Governorate', c.governorate || '—'],
    ['City', c.city || '—'],
    ['Address', c.address || '—']
  ];
  if (c.landmark) cf.push(['Landmark', c.landmark]);

  var cHTML = cf.map(function(row) {
    return '<div class="r"><span class="l">' + row[0] + '</span><span class="v">' + row[1] + '</span></div>';
  }).join('');

  // Table rows
  var rn = 0;
  var tRows = items.map(function(it) {
    rn++;
    var lt = it.price * it.qty;
    var vr = it.variation ? '<br><span style="font-size:.68rem;color:#5a6b80">' + it.variation + '</span>' : '';
    return '<tr><td>' + rn + '</td><td>' + it.id + '</td><td>' + it.name + vr + '</td><td>' + it.qty + '</td><td>' + it.price.toLocaleString() + '</td><td style="font-weight:700">' + lt.toLocaleString() + '</td></tr>';
  }).join('');

  // Render visible invoice
  document.getElementById('invArea').innerHTML =
    '<div class="inv-wrap" id="invW">' +
      '<div class="inv-hdr">' +
        '<div>' +
          '<div class="inv-logo">CURA <span>STORE</span></div>' +
          '<div class="inv-sub">Premium Dental Supplies — Invoice</div>' +
        '</div>' +
        '<div class="inv-meta">' +
          '<div class="inum">Invoice #' + inum + '</div>' +
          '<div class="idate">' + idate + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ict"><i class="fas fa-user"></i> Customer Information</div>' +
      '<div class="icg">' + cHTML + '</div>' +
      '<hr class="idiv" />' +
      '<table class="it">' +
        '<thead><tr><th style="width:36px">#</th><th style="width:90px">Item ID</th><th>Product</th><th style="width:50px">Qty</th><th style="width:80px">Price</th><th style="width:90px">Total</th></tr></thead>' +
        '<tbody>' + tRows + '<tr class="gr"><td colspan="5" style="text-align:right">Grand Total (EGP)</td><td>' + total.toLocaleString() + '</td></tr></tbody>' +
      '</table>' +
      '<div class="inv-ft"><strong>Cura Store</strong> — Premium Dental Supplies<br>Thank you for your order. This invoice was generated automatically.</div>' +
    '</div>';

  document.getElementById('actsArea').style.display = 'flex';
})();

// ================================================================
// ULTRA HIGH-QUALITY PNG DOWNLOAD
// Strategy: Build an off-screen 2400px-wide invoice with ALL inline styles,
// then capture at scale 1. This produces a native 2400px image with zero
// upscaling artifacts — the highest possible quality from html2canvas.
// ================================================================
function dlInv() {
  var btn = document.getElementById('dlBtn');
  btn.classList.add('ld');
  btn.disabled = true;

  var raw = JSON.parse(localStorage.getItem('curaInvoice') || '{}');
  var inum = raw.invoiceNumber || '000000';
  var idate = raw.invoiceDate || '';
  var c = raw.customer || {};
  var items = raw.items || [];
  var total = raw.total || 0;

  // Build customer info rows with inline styles
  var cf = [
    ['Name', c.name || '—'],
    ['Phone', c.phone || '—'],
    ['Alt. Phone', c.altPhone || '—'],
    ['Gender', c.gender || '—'],
    ['Governorate', c.governorate || '—'],
    ['City', c.city || '—'],
    ['Address', c.address || '—']
  ];
  if (c.landmark) cf.push(['Landmark', c.landmark]);

  var cHTML = cf.map(function(row) {
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted #dfe5ee;font-size:22px;">' +
      '<span style="color:#5a6b80;font-weight:500;">' + row[0] + '</span>' +
      '<span style="font-weight:600;color:#0a1628;text-align:right;max-width:60%;word-break:break-word;">' + row[1] + '</span>' +
    '</div>';
  }).join('');

  // Build table rows with inline styles
  var rn = 0;
  var tRows = items.map(function(it) {
    rn++;
    var lt = it.price * it.qty;
    var vr = it.variation ? '<div style="font-size:16px;color:#5a6b80;margin-top:2px;">' + it.variation + '</div>' : '';
    return '<tr>' +
      '<td style="padding:18px 16px;text-align:center;border-bottom:1px solid #eef1f6;color:#0a1628;font-size:20px;">' + rn + '</td>' +
      '<td style="padding:18px 16px;text-align:left;border-bottom:1px solid #eef1f6;font-weight:700;font-size:17px;color:#1a8a7d;letter-spacing:.3px;">' + it.id + '</td>' +
      '<td style="padding:18px 16px;text-align:left;border-bottom:1px solid #eef1f6;color:#0a1628;font-size:20px;line-height:1.3;">' + it.name + vr + '</td>' +
      '<td style="padding:18px 16px;text-align:center;border-bottom:1px solid #eef1f6;color:#0a1628;font-size:20px;">' + it.qty + '</td>' +
      '<td style="padding:18px 16px;text-align:center;border-bottom:1px solid #eef1f6;color:#0a1628;font-size:20px;">' + it.price.toLocaleString() + '</td>' +
      '<td style="padding:18px 16px;text-align:center;border-bottom:1px solid #eef1f6;font-weight:700;color:#0a1628;font-size:20px;">' + lt.toLocaleString() + '</td>' +
    '</tr>';
  }).join('');

  // Create off-screen high-res container — 2400px wide, all inline styles
  var container = document.createElement('div');
  container.id = 'hdCapture';
  container.style.cssText = 'position:fixed;left:-99999px;top:0;width:2400px;background:#ffffff;color:#0a1628;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;padding:96px 88px;';

  container.innerHTML =
    // HEADER
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid #0d2137;padding-bottom:28px;margin-bottom:36px;flex-wrap:wrap;gap:20px;">' +
      '<div>' +
        '<div style="font-size:68px;font-weight:900;color:#0a1628;letter-spacing:-1px;">CURA <span style="font-weight:300;color:#1a8a7d;">STORE</span></div>' +
        '<div style="font-size:18px;color:#5a6b80;letter-spacing:1px;text-transform:uppercase;margin-top:6px;">Premium Dental Supplies — Invoice</div>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<div style="font-size:24px;font-weight:700;color:#0a1628;">Invoice #' + inum + '</div>' +
        '<div style="font-size:20px;color:#5a6b80;margin-top:6px;">' + idate + '</div>' +
      '</div>' +
    '</div>' +
    // CUSTOMER INFO TITLE
    '<div style="font-size:18px;font-weight:700;color:#1a8a7d;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;">Customer Information</div>' +
    // CUSTOMER INFO GRID
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin-bottom:36px;">' + cHTML + '</div>' +
    // DIVIDER
    '<div style="border:none;border-top:1px solid #dfe5ee;margin:28px 0;"></div>' +
    // TABLE
    '<table style="width:100%;border-collapse:collapse;font-size:20px;">' +
      '<thead>' +
        '<tr>' +
          '<th style="background:#0d2137;color:#ffffff;padding:18px 16px;text-align:center;font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;width:70px;">#</th>' +
          '<th style="background:#0d2137;color:#ffffff;padding:18px 16px;text-align:left;font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;width:180px;">Item ID</th>' +
          '<th style="background:#0d2137;color:#ffffff;padding:18px 16px;text-align:left;font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;">Product</th>' +
          '<th style="background:#0d2137;color:#ffffff;padding:18px 16px;text-align:center;font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;width:90px;">Qty</th>' +
          '<th style="background:#0d2137;color:#ffffff;padding:18px 16px;text-align:center;font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;width:140px;">Price</th>' +
          '<th style="background:#0d2137;color:#ffffff;padding:18px 16px;text-align:center;font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase;width:160px;">Total</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody>' +
        tRows +
        '<tr>' +
          '<td colspan="5" style="padding:20px 16px;text-align:right;font-weight:900;font-size:28px;background:#f5f0e8;border-top:4px solid #b8863e;color:#8a6a2a;">Grand Total (EGP)</td>' +
          '<td style="padding:20px 16px;text-align:center;font-weight:900;font-size:28px;background:#f5f0e8;border-top:4px solid #b8863e;color:#8a6a2a;">' + total.toLocaleString() + '</td>' +
        '</tr>' +
      '</tbody>' +
    '</table>' +
    // FOOTER
    '<div style="margin-top:40px;padding-top:20px;border-top:1px solid #dfe5ee;text-align:center;font-size:17px;color:#5a6b80;line-height:1.8;">' +
      '<strong style="color:#0a1628;">Cura Store</strong> — Premium Dental Supplies<br>' +
      'Thank you for your order. This invoice was generated automatically.' +
    '</div>';

  // Add to DOM (off-screen)
  document.body.appendChild(container);

  // Small delay to ensure rendering is complete
  setTimeout(function() {
    html2canvas(container, {
      scale: 1,
      width: 2400,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      imageTimeout: 15000,
      removeContainer: false
    }).then(function(canvas) {
      // Remove off-screen container
      var el = document.getElementById('hdCapture');
      if (el) document.body.removeChild(el);

      // Post-process: ensure max quality output
      var finalCanvas = document.createElement('canvas');
      finalCanvas.width = canvas.width;
      finalCanvas.height = canvas.height;
      var ctx = finalCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(canvas, 0, 0);

      // Download
      var link = document.createElement('a');
      link.download = 'Cura_Invoice_' + inum + '.png';
      link.href = finalCanvas.toDataURL('image/png', 1.0);
      link.click();

      btn.classList.remove('ld');
      btn.disabled = false;

      // Show confirmation
      showConfirm();
    }).catch(function(err) {
      console.error('PNG export failed:', err);
      var el = document.getElementById('hdCapture');
      if (el) document.body.removeChild(el);
      btn.classList.remove('ld');
      btn.disabled = false;
      alert('Download failed. Please try again.');
    });
  }, 300);
}

// ================================================================
// CONFIRMATION & WHATSAPP REDIRECT
// ================================================================
function showConfirm() {
  var ov = document.getElementById('coOverlay');
  ov.classList.add('open');

  setTimeout(function() {
    var raw = JSON.parse(localStorage.getItem('curaInvoice') || '{}');
    var gender = (raw.customer && raw.customer.gender) || 'Male';
    var waURL;

    if (gender === 'Female') {
      // رنيم — Female customers
      waURL = 'https://wa.me/201064112263';
    } else {
      // عمرو — Male customers
      waURL = 'https://wa.me/201031718103';
    }

    window.open(waURL, '_blank');
    setTimeout(function() { ov.classList.remove('open'); }, 1200);
  }, 3000);
}
</script>
</body>
</html>
